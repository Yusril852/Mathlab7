home:()=>{const t=S.tot,a=t?Math.round(S.ok/t*100):0,c=g=>`<div class="card bab b${g}" style="cursor:pointer" tabindex=0 onclick="go('kelas',${g})" onkeydown="event.key=='Enter'&&go('kelas',${g})"><div class=big>${CI[g-1]} Bab ${g}</div><b>${CH[g-1]}</b><div class=mu>${gdone(g)} dari ${T[g].length} sub-bab dicoba</div>${bar(gdone(g)/T[g].length*100)}</div>`;return`<div class=hero><div><h1>Halo, ${esc(S.name)}! 👋</h1><p>Kelas ${esc(S.kls||'7')} · ${esc(S.skl||'SMP')}<br>Pilih bab, baca ringkasan materi, lalu kerjakan 3 level latihan.</p></div><div class=lv>Level ${lvl()}</div></div><div class=grid><div class=card><div class=big>🔥 ${streak()}</div><div class=mu>hari beruntun</div></div><div class=card><div class=big>${t}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${a}%</div><div class=mu>akurasi</div></div><div class=card><div class=big>${S.xp}</div><div class=mu>XP</div></div></div>${HM.map(x=>typeof x=='number'?c(x):x[0]=='sem'?`<h2 class=sem>${x[1]}</h2>`:`<div class=mark>${x[1]}</div>`).join('')}`},
play:()=>{const q=P.qs[P.k],a=P.a,done=a!=null,ok=done&&q.o[a]==q.a;return`<div class="row sp"><b>Bab ${P.g} · ${P.i==null?'Ulangan campuran':T[P.g][P.i].n+' · '+LN[P.L]}</b><span class=mu>Soal ${P.k+1} dari ${P.qs.length}</span></div>${bar((P.k+(done?1:0))/P.qs.length*100)}<div class=card>${q.g?`<div class=gfx>${q.g}</div>`:''}<div class=q>${q.q}</div>${q.o.map((o,j)=>`<button class="opt ${done?(o==q.a?'ok':j==a?'no':''):''}" onclick="ans(${j})">${o}</button>`).join('')}${done?`<div class="fb ${ok?'ok':'no'}">${ok?'🎉 <b>Benar!</b> +10 XP':'❌ <b>Belum tepat.</b> Jawaban benar: <b>'+q.a+'</b>'}${q.e?'<br>💡 '+q.e:''}</div>`:''}</div>${done?`<button class=btn onclick=next()>${P.k==P.qs.length-1?'Lihat hasil':'Soal berikutnya'} →</button>`:''}`},
prog:()=>{const A=[['🎯','Langkah pertama',S.tot>0],['🔥','3 hari beruntun',streak()>=3],['💯','Nilai sempurna',!!S.perf],['⭐','500 XP',S.xp>=500],['🎓','Semua sub-bab satu bab dicoba',GS.some(g=>gdone(g)==T[g].length)]];return`<h1>📊 Progress</h1>${GS.map(g=>`<div class=card><div class="row sp"><b>Bab ${g}: ${CH[g-1]}</b><span class=mu>${gdone(g)}/${T[g].length} sub-bab</span></div>${bar(gdone(g)/T[g].length*100)}<div class=mu>${T[g].map((t,i)=>[1,2,3].some(L=>S.p[g+'.'+i+'.'+L]!=null)?t.n+': '+[1,2,3].map(L=>S.p[g+'.'+i+'.'+L]??'–').join('/')+'%':'').filter(Boolean).join(' · ')||'Belum ada latihan.'}</div></div>`).join('')}${hv(S)}<h2>Pencapaian</h2><div class=grid>${A.map(a=>`<div class=card style="${a[2]?'':'opacity:.45'}"><div class=big>${a[0]}</div><b>${a[1]}</b></div>`).join('')}</div>`}};
function render(){const lg='<div class=lg>Math<i>Kids</i> SMP 7</div>';if(!S&&V!='guru'&&V!='gdet')V='login';$('#sb').innerHTML=lg+(S?[['home','🏠 Beranda'],['prog','📊 Progress'],['guru','👩‍🏫 Guru'],['val','🧪 Validator']].map(x=>`<button class="${V==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'<button onclick=out()>🚪 Keluar</button><div class=mu id=syn>'+synT()+'</div>':(V=='guru'||V=='gdet'?'<button onclick="go(\'login\')">🏠 Halaman siswa</button>':''));$('#app').innerHTML=W[V]()}
const LN=['','🌱 Level 1 Dasar','🌿 Level 2 Kontekstual','🌳 Level 3 HOTS'],hu=()=>Math.floor(Math.random()*360),
NM=['Pak Slamet','Bu Sri','Mbak Wati','Dimas','Rina','Pak Joko','Bu Tini','Agus','Sekar','Bagas'],
PL=['Pasar Kendal','Pantai Sendang Sikucing','kebun teh Medini','Curug Sewu','alun-alun Kendal','Pasar Weleri','tambak Brangsong','Kaliwungu','Pantai Cahaya'],
IT=[['ikan bandeng','ekor'],['udang','ekor'],['klepon','butir'],['serabi','buah'],['kain batik','lembar'],['jeruk','buah'],['kerupuk','bungkus']],
nm=()=>pick(NM),pl=()=>pick(PL),it=()=>pick(IT);
const mk=(g,i,L)=>{const pool=i==null?T[g].map((_,j)=>j):[i],qs=[],seen=new Set;for(let n=0;n<2500&&qs.length<25;n++){LV=i==null?pick([1,2,3]):L;const q=T[g][pick(pool)].g(),k=q.q+q.g;if(!seen.has(k)){seen.add(k);qs.push(q)}}return qs};
function start(g,i,L){P={g,i,L,qs:mk(g,i,L),k:0,ok:0,a:null};go('play')}
function next(){P.k++;if(P.k<P.qs.length){P.a=null;return go('play')}const sc=Math.round(P.ok/P.qs.length*100);P.sc=sc;S.hist.push({g:P.g,i:P.i??-1,L:P.L,sc,n:P.qs.length,t:Date.now()});if(S.hist.length>60)S.hist.shift();S.xp+=sc==100?50:20;if(P.i!=null){const key=P.g+'.'+P.i+'.'+P.L;S.p[key]=Math.max(S.p[key]||0,sc)}const d=day(new Date);if(!S.days.includes(d))S.days.push(d);if(sc==100)S.perf=1;sv();go('res')}
W.kelas=()=>`<button class="btn s" onclick="go('home')">← Semua bab</button><h2>Bab ${G}: ${CH[G-1]}</h2>`+T[G].map((t,i)=>{LV=1;const ex=t.g();return`<div class=card><b>${T[G].length>1?'abcdef'[i]+'. ':''}${t.n}</b><details><summary>📖 Baca materi</summary><p>${t.m}</p><div class=ex><b>Contoh:</b> ${ex.q}${ex.g?`<div class=gfx>${ex.g}</div>`:''}<br>Jawab: <b>${ex.a}</b>. ${ex.e}</div></details><div class=row>${[1,2,3].map(L=>{const b=S.p[G+'.'+i+'.'+L];return`<button class="btn lvb l${L}" onclick="start(${G},${i},${L})">${LN[L]}<small>${b!=null?'⭐'.repeat(b>=90?3:b>=70?2:b>=40?1:0)+' '+b+'%':'25 soal'}</small></button>`}).join('')}</div></div>`}).join('')+`<button class="btn y" onclick="start(${G},null,2)">🎯 Ulangan campuran (25 soal)</button>`;
W.res=()=>`<div class="card" style="text-align:center"><div class=big style="font-size:3rem">${P.sc>=90?'🏆':P.sc>=70?'😄':'💪'}</div><h1>${P.sc>=90?'Luar biasa!':P.sc>=70?'Hebat!':'Ayo coba lagi!'}</h1><div class=big style="font-size:3.2rem">${P.sc}</div><div style="font-size:2rem">${'⭐'.repeat(P.sc>=90?3:P.sc>=70?2:P.sc>=40?1:0)}</div>${bar(P.sc)}<p>Benar <b>${P.ok}</b> dari <b>${P.qs.length}</b> soal.</p></div><div class=row><button class=btn onclick="start(${P.g},${P.i==null?'null':P.i},${P.L})">🔄 Ulangi</button>${P.i!=null&&P.L<3?`<button class="btn y" onclick="start(${P.g},${P.i},${P.L+1})">Level berikutnya ➜</button>`:''}<button class="btn s" onclick="go('kelas',${P.g})">Pilih materi lain</button></div>`;
W.val=()=>{let tot=0,bad=[];for(let g=1;g<=7;g++)T[g].forEach((t,i)=>[1,2,3].forEach(L=>{const qs=mk(g,i,L);tot+=qs.length;if(qs.length<25)bad.push(`B${g} ${t.n} L${L}: hanya ${qs.length} soal unik`);qs.forEach((q,j)=>{if(!q.o.includes(q.a)||new Set(q.o).size!=q.o.length||q.o.length<3)bad.push(`B${g} ${t.n} L${L} #${j+1}: opsi bermasalah`)})}));return`<h1>🧪 Validator Soal</h1><div class=card><div class=big>${tot} soal dibuat</div><p>${bad.length?'⚠️ '+bad.length+' temuan':'✅ Semua soal lolos'}</p><p class=mu>Cek: 25 soal unik per level, jawaban benar ada di opsi, opsi tidak ganda dan minimal 3.</p>${bad.slice(0,40).map(b=>`<div class=mu>⚠️ ${b}</div>`).join('')}</div>`};

let GD={st:{},pr:{}},GF={skl:'',kls:'',q:'',d:null},GOK=false,gsub=false;
const isOn=p=>!!p&&p.isOnline===true&&(Date.now()+off-(p.last_changed||0))<90000;
function gSub(){if(!db||gsub)return;gsub=true;authP.then(()=>{db.ref(APP+'/ringkas').on('value',s=>{GD.st=s.val()||{};gUp()});db.ref(APP+'/presence').on('value',s=>{GD.pr=s.val()||{};gUp()})});setInterval(gUp,15000)}
function gUp(){if(V=='guru'&&GOK)gTab();if(V=='gdet'){const e=$('#gds');if(e)e.innerHTML=isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}}
function gOpt(id,vals,lbl,cur){const e=$(id);if(!e)return;e.innerHTML=`<option value="">${lbl}</option>`+vals.map(v=>`<option${v==cur?' selected':''}>${esc(v)}</option>`).join('')}
function gTab(){const ks=Object.keys(GD.st),sv2=x=>[...new Set(ks.map(k=>GD.st[k][x]).filter(Boolean))].sort();gOpt('#gsk',sv2('skl'),'Semua sekolah',GF.skl);gOpt('#gkl',sv2('kls'),'Semua kelas',GF.kls);const q=GF.q.toLowerCase(),rows=ks.map(k=>({k,d:GD.st[k],o:isOn(GD.pr[k]),lc:(GD.pr[k]||{}).last_changed||0})).filter(r=>(!GF.skl||r.d.skl==GF.skl)&&(!GF.kls||r.d.kls==GF.kls)&&(!q||(r.d.name||'').toLowerCase().includes(q))).sort((a,b)=>b.o-a.o||(a.d.name||'').localeCompare(b.d.name||''));
$('#gsm').innerHTML=`🟢 <b>${rows.filter(r=>r.o).length}</b> online · ${rows.length} siswa tampil dari ${ks.length}`;
$('#gt').innerHTML=rows.map(r=>{const d=r.d,a=d.tot?Math.round(d.ok/d.tot*100):0;return`<tr><td>${r.o?'🟢 Online':'⚪ Offline'}<td><b>${esc(d.name)}</b><td>${esc(d.kls)}<td>${esc(d.skl)}<td>${d.xp||0}<td>${d.tot||0}<td>${a}%<td>${r.o?'sekarang':dt(r.lc||d.upd)}<td><button class="btn s" onclick="gDet('${r.k}')">Detail</button>`}).join('')||'<tr><td colspan=9>Belum ada data siswa.'}
function gDet(k){GF.d=k;GD.dt=0;go('gdet');authP.then(()=>db.ref(APP+'/detail/'+k).get()).then(sn=>{GD.dt=sn.val();if(V=='gdet')render()}).catch(()=>{GD.dt=null;if(V=='gdet')render()})}
function gpin(){if($('#gp').value==GURU_PIN){GOK=true;render()}else $('#gm').textContent='PIN salah.'}
W.guru=()=>{if(!GOK)return`<div class=card style="max-width:400px;margin:30px auto;text-align:center"><div class=big>👩‍🏫</div><h1>Dashboard Guru</h1><input id=gp type=password class=inp placeholder="PIN guru" onkeydown="event.key=='Enter'&&gpin()"><button class=btn onclick=gpin()>Masuk</button><p class=mu id=gm></p></div>`;if(!db)return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card>Firebase belum dikonfigurasi. Isi <code>FB_CONFIG</code> di bagian script agar monitoring realtime aktif.</div>`;gSub();setTimeout(gTab,0);return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card><div class=row style="flex-wrap:wrap;gap:8px"><select id=gsk class=inp onchange="GF.skl=this.value;gTab()"></select><select id=gkl class=inp onchange="GF.kls=this.value;gTab()"></select><input class=inp placeholder="🔍 Cari nama siswa" value="${esc(GF.q)}" oninput="GF.q=this.value;gTab()"></div><p class=mu id=gsm></p></div><div class="card tw"><table><tr><td><b>Status<td><b>Nama<td><b>Kelas<td><b>Sekolah<td><b>XP<td><b>Soal<td><b>Akurasi<td><b>Terakhir aktif<td><b>Aksi<tbody id=gt></tbody></table></div>`};
W.gdet=()=>{const raw=GD.dt;const back=`<button class="btn s" onclick="go('guru')">← Kembali ke daftar</button>`;if(raw===0)return back+'<div class=card>⏳ Memuat detail…</div>';if(!raw)return back+'<div class=card>Data siswa tidak ditemukan.</div>';const d=norm(raw),pc=(o,t)=>t?Math.round(o/t*100):null,col=x=>x==null?'':x<60?'color:#d62828;font-weight:800':'color:#1b8a4b;font-weight:800';
const babs=GS.map(g=>{let o=0,t=0;Object.entries(d.ac).forEach(([k,v])=>{if(k.split('_')[0]==g){o+=v[0];t+=v[1]}});return[g,o,t]}),weak=[];
const rows=GS.flatMap(g=>T[g].map((t,i)=>{const c=[1,2,3].map(L=>{const v=d.ac[g+'_'+i+'_'+L];if(!v)return'<td>–';const x=pc(v[0],v[1]);if(v[1]>=5)weak.push([x,`Bab ${g} · ${t.n} (L${L}) ${x}%`]);return`<td style="${col(x)}">${x}% <span class=mu>(${v[0]}/${v[1]})</span>`}).join('');return`<tr><td>B${g} · ${esc(t.n)}${c}`}));
return back+`<h1>👤 ${esc(d.name)}</h1><p class=mu>Kelas ${esc(d.kls)} · ${esc(d.skl)} · <span id=gds>${isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}</span></p><div class=grid><div class=card><div class=big>⭐ ${d.xp}</div><div class=mu>XP</div></div><div class=card><div class=big>🔥 ${stk(d.days)}</div><div class=mu>hari beruntun</div></div><div class=card><div class=big>${d.tot}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${d.tot?Math.round(d.ok/d.tot*100):0}%</div><div class=mu>akurasi</div></div></div>
<h2>📊 Akurasi per bab</h2>${babs.map(b=>{const x=pc(b[1],b[2]);return`<div class=card><div class="row sp"><b>Bab ${b[0]}: ${CH[b[0]-1]}</b><span style="${col(x)}">${x==null?'belum ada':x+'% ('+b[1]+'/'+b[2]+')'}</span></div>${bar(x||0)}</div>`}).join('')}
<h2>🎯 Akurasi per sub-bab & level</h2><div class="card tw"><table><tr><td><b>Materi<td><b>L1<td><b>L2<td><b>L3${rows.join('')}</table></div>
<h2>⚠️ Perlu bimbingan</h2><div class=card>${weak.sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>x[1]).join('<br>')||'Belum cukup data (minimal 5 soal per level).'}</div>${hv(d)}`};

let LB=[],lbs=false;
function lbDraw(){const e=$('#lb');if(!e)return;const m=['🥇','🥈','🥉'];e.innerHTML=db?(LB.length?LB.map((x,i)=>`<div class="row sp" style="padding:6px 0;border-bottom:1px dashed #f0c14b"><span>${m[i]||'<b>'+(i+1)+'.</b>'} <b>${esc(x.name)}</b> <span class=mu>${esc(x.kls)} · ${esc(x.skl)}</span></span><b>${x.xp} XP</b></div>`).join(''):'<p class=mu>Belum ada peringkat. Jadilah yang pertama!</p>'):'<p class=mu>Aktifkan Firebase untuk melihat peringkat.</p>'}
function lbSub(){if(db&&!lbs){lbs=true;authP.then(()=>db.ref(APP+'/ringkas').orderByChild('xp').limitToLast(10).on('value',sn=>{const a=[];sn.forEach(c=>{a.push(c.val())});LB=a.reverse();lbDraw()},()=>{LB=[];lbDraw()}))}setTimeout(lbDraw,0);return''}
if(S)resume();
render();
</script></body></html>
