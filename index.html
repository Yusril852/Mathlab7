<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-5-3-1"><div class="extext">4 kg bandeng harganya Rp180 ribu. Misal harga 1 kg adalah x, maka 4x = 180 dan x = 45. Harga 1 kg Rp45 ribu.</div><label class="got" for="x-5-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-5-3-2"><div class="extext">Ongkos kirim paket Rp15 ribu ditambah Rp6 ribu tiap kg. Totalnya Rp63 ribu. Persamaannya 6x + 15 = 63, jadi 6x = 48 dan x = 8 kg.</div><label class="got" for="x-5-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-5-3-3"><div class="extext">Dimas 4 tahun lebih tua dari Rina dan jumlah umur mereka 28 tahun. Misal umur Rina x, maka x + (x + 4) = 28. Didapat 2x = 24 dan x = 12. Umur Rina 12 tahun dan Dimas 16 tahun.</div><label class="got" for="x-5-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-5-3-4"><div class="extext">Persamaan dua sisi: 5x − 3 = 2x + 12. Kumpulkan x di kiri: 5x − 2x = 12 + 3, jadi 3x = 15 dan x = 5.</div><label class="got" for="x-5-3-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-5-3-5"><div class="extext">Lebar kebun x m dan panjangnya (x + 5) m. Kelilingnya 50 m. Persamaannya 2(2x + 5) = 50, jadi 2x + 5 = 25 dan x = 10. Kebunnya 10 m × 15 m.</div><label class="got" for="x-5-3-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-5-3-6"><div class="extext">Pola bilangan 5, 8, 11, 14, ... Selisih tetap 3, jadi rumus suku ke-n adalah Uₙ = 3n + 2. Cek U₁ = 5 dan U₂ = 8. Suku ke-20 adalah 3(20) + 2 = 62.</div><label class="got" for="x-5-3-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-5-3-7"><div class="extext">Jumlah tiga bilangan bulat berurutan 48. Bilangan tengah 48 ÷ 3 = 16, jadi bilangannya 15, 16, 17. Yang terbesar 17.</div><label class="got" for="x-5-3-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-5-3-8"><div class="extext">Jumlah tiga bilangan genap berurutan 54. Bilangan tengah 18, jadi bilangannya 16, 18, 20. Yang terbesar 20.</div><label class="got" for="x-5-3-8"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Saat memindahkan suku ke sisi lain, tandanya berubah. Selalu periksa jawaban ke ceritanya, karena persamaan yang salah tetap bisa menghasilkan angka yang "tampak benar".</p></details>
<p class="sum"><strong>Ringkasan.</strong> Misalkan, tulis persamaan, selesaikan, periksa. Untuk ax + b = c, x = (c − b) ÷ a. Pola dengan selisih tetap a memiliki rumus Uₙ = an + b.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 8 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-6">Lanjut ke Bab 6</a></div></div></section></article><article class="panel" id="bab-6" style="--c:var(--c6)"><header class="chead"><div class="wrap"><h2>Bab 6. Kesebangunan</h2><div class="intro"><p>Bab ini membahas hubungan antar sudut, lalu bangun-bangun yang bentuknya sama tetapi ukurannya boleh berbeda. Sub-bab: hubungan antar sudut, arti kesebangunan, dan kesebangunan pada segitiga.</p></div><p class="meta">3 sub-bab dan 21 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-6-1" href="#bab-6-1">6.1 Hubungan Antar Sudut<span class="donemark">selesai</span></a><a class="stab stab-6-2" href="#bab-6-2">6.2 Arti Kesebangunan<span class="donemark">selesai</span></a><a class="stab stab-6-3" href="#bab-6-3">6.3 Kesebangunan pada Segitiga<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-6-1"><div class="wrap"><h3 class="st">6.1 Hubungan Antar Sudut</h3><p class="idea"><strong>Ide pokok.</strong> Sudut-sudut yang berhubungan punya aturan jumlah atau kesamaan yang pasti, jadi satu sudut bisa dicari dari sudut lain.</p>
<h4 class="lab">Penjelasan</h4>
<div class="tw"><table><thead><tr><th>Hubungan</th><th>Aturan</th></tr></thead><tbody><tr><td>Berpelurus</td><td>jumlah 180°</td></tr><tr><td>Berpenyiku</td><td>jumlah 90°</td></tr><tr><td>Bertolak belakang</td><td>sama besar</td></tr><tr><td>Sehadan (garis sejajar dipotong garis lain)</td><td>sama besar</td></tr><tr><td>Dalam berseberangan (garis sejajar)</td><td>sama besar</td></tr><tr><td>Dalam sepihak (garis sejajar)</td><td>jumlah 180°</td></tr><tr><td>Sudut dalam segitiga</td><td>jumlah 180°</td></tr></tbody></table></div>
<p>Pada segitiga sama kaki, dua sudut alasnya sama besar. Pada jam, setiap jam menempati sudut 30°, karena 360° ÷ 12 = 30°.</p>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-6-1-1"><div class="extext">Pelurus sudut 65° adalah 180° − 65° = 115°.</div><label class="got" for="x-6-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-6-1-2"><div class="extext">Penyiku sudut 35° adalah 90° − 35° = 55°.</div><label class="got" for="x-6-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-6-1-3"><div class="extext">Dua sudut segitiga 50° dan 70°. Sudut ketiga 180° − 50° − 70° = 60°.</div><label class="got" for="x-6-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-6-1-4"><div class="extext">Atap rumah berbentuk segitiga sama kaki dengan sudut puncak 40°. Dua sudut alas sama besar, jadi tiap sudut alas (180° − 40°) ÷ 2 = 70°.</div><label class="got" for="x-6-1-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-6-1-5"><div class="extext">Jam menunjukkan pukul 5.00. Sudut antara dua jarum 5 × 30° = 150°.</div><label class="got" for="x-6-1-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-6-1-6"><div class="extext">Dua sudut berpelurus besarnya (2x)° dan (3x)°. Persamaannya 5x = 180, jadi x = 36. Sudutnya 72° dan 108°.</div><label class="got" for="x-6-1-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-6-1-7"><div class="extext">Dua sudut sehadan pada garis sejajar besarnya (3x + 10)° dan (5x − 30)°. Sama besar: 3x + 10 = 5x − 30, jadi 2x = 40 dan x = 20. Tiap sudut 70°.</div><label class="got" for="x-6-1-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-6-1-8"><div class="extext">Sudut-sudut segitiga x°, 2x°, dan 3x°. Jumlahnya 6x = 180, jadi x = 30. Sudutnya 30°, 60°, dan 90°.</div><label class="got" for="x-6-1-8"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Jangan tertukar antara pelurus (180°) dan penyiku (90°). Sudut dalam sepihak jumlahnya 180°, bukan sama besar. Pastikan garisnya benar-benar sejajar sebelum memakai aturan sehadan atau berseberangan.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Pelurus 180°, penyiku 90°. Sehadan dan berseberangan sama besar. Sepihak berjumlah 180°. Segitiga 180°.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 8 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-6-2">Lanjut ke 6.2 Arti Kesebangunan</a></div></div></section><section class="sec" id="bab-6-2"><div class="wrap"><h3 class="st">6.2 Arti Kesebangunan</h3><p class="idea"><strong>Ide pokok.</strong> Dua bangun sebangun jika bentuknya sama persis, meskipun ukurannya berbeda. Seperti foto yang diperbesar tanpa ditarik.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Dua bangun <strong>sebangun</strong> jika (1) sudut-sudut yang bersesuaian sama besar, dan (2) sisi-sisi yang bersesuaian sebanding.</li><li>Perbandingan sisi bersesuaian disebut <strong>faktor skala</strong> (k). Sisi bangun besar = sisi bangun kecil × k.</li><li>Jika k = 1, kedua bangun sama persis ukurannya. Bangun seperti itu disebut <strong>kongruen</strong>.</li><li>Perbandingan keliling sama dengan k. Perbandingan luas sama dengan k².</li><li>Semua persegi sebangun. Semua lingkaran sebangun. Tetapi tidak semua persegi panjang sebangun, sebab perbandingan panjang dan lebarnya bisa berbeda.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-6-2-1"><div class="extext">Persegi panjang 6 cm × 4 cm sebangun dengan persegi panjang lain yang lebarnya 8 cm. Faktor skala 8 ÷ 4 = 2, jadi panjangnya 6 × 2 = 12 cm.</div><label class="got" for="x-6-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-6-2-2"><div class="extext">Foto 12 cm × 8 cm diperbesar sebangun menjadi poster dengan lebar 12 cm. Faktor skala 12 ÷ 8 = 1,5, jadi panjang poster 12 × 1,5 = 18 cm.</div><label class="got" for="x-6-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-6-2-3"><div class="extext">Tiang bendera setinggi 2 m berbayangan 3 m. Pada saat yang sama, bayangan pohon kelapa 12 m. Perbandingan tinggi sama dengan perbandingan bayangan: tinggi pohon 2 ÷ 3 × 12 = 8 m.</div><label class="got" for="x-6-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-6-2-4"><div class="extext">Dua persegi panjang sebangun dengan perbandingan sisi 2 : 3. Luas yang kecil 20 cm². Perbandingan luas 4 : 9, jadi luas yang besar 20 × 9 ÷ 4 = 45 cm².</div><label class="got" for="x-6-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-6-2-5"><div class="extext">Dua segitiga sebangun dengan perbandingan sisi 2 : 3. Keliling segitiga kecil 18 cm, maka keliling segitiga besar 18 × 3 ÷ 2 = 27 cm.</div><label class="got" for="x-6-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-6-2-6"><div class="extext">Spanduk 30 cm × 15 cm dibuat versi besar sebangun dengan faktor skala 4. Ukurannya menjadi 120 cm × 60 cm.</div><label class="got" for="x-6-2-6"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Menambah panjang dan lebar dengan bilangan yang sama (misalnya masing-masing +2) tidak menghasilkan bangun sebangun. Harus dikalikan dengan faktor skala yang sama. Dan perbandingan luas adalah k², bukan k.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Sebangun: sudut sama, sisi sebanding. Keliling berbanding k, luas berbanding k².</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 6 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-6-3">Lanjut ke 6.3 Kesebangunan pada Segitiga</a></div></div></section><section class="sec" id="bab-6-3"><div class="wrap"><h3 class="st">6.3 Kesebangunan pada Segitiga</h3><p class="idea"><strong>Ide pokok.</strong> Dua segitiga sudah pasti sebangun jika memenuhi salah satu dari tiga syarat, tanpa perlu memeriksa semuanya.</p>
<h4 class="lab">Penjelasan: tiga syarat segitiga sebangun</h4>
<ol class="steps"><li>Ketiga sudut bersesuaian sama besar (cukup dua sudut, karena sudut ketiga ikut sama).</li><li>Ketiga sisi bersesuaian sebanding.</li><li>Dua sisi bersesuaian sebanding, dan sudut yang diapit kedua sisi itu sama besar.</li></ol>
<h4 class="lab">Dua pola yang sering muncul</h4>
<ul class="pts"><li><strong>Garis sejajar alas</strong>: pada segitiga ABC, jika DE sejajar BC (D di AB, E di AC), maka segitiga ADE sebangun dengan segitiga ABC, dan AD/AB = AE/AC = DE/BC.</li><li><strong>Segitiga siku-siku dengan tinggi ke sisi miring</strong>: pada segitiga ABC siku-siku di B, jika BD tegak lurus AC, maka BD² = AD × DC.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-6-3-1"><div class="extext">DE sejajar BC dengan AD = 3, AB = 9, dan DE = 5. AD/AB = 1/3, jadi DE/BC = 1/3 dan BC = 15.</div><label class="got" for="x-6-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-6-3-2"><div class="extext">Segitiga bersisi 3, 4, 5 dan segitiga bersisi 6, 8, 10. Perbandingan 6/3 = 8/4 = 10/5 = 2, jadi sebangun dengan k = 2.</div><label class="got" for="x-6-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-6-3-3"><div class="extext">Segitiga pertama bersudut 50° dan 60°, segitiga kedua bersudut 60° dan 70°. Sudut ketiga segitiga pertama 70°, sudut ketiga segitiga kedua 50°. Ketiga sudutnya sama, jadi sebangun.</div><label class="got" for="x-6-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-6-3-4"><div class="extext">Segitiga siku-siku dengan AD = 4 cm dan DC = 9 cm. BD² = 4 × 9 = 36, jadi BD = 6 cm.</div><label class="got" for="x-6-3-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-6-3-5"><div class="extext">DE sejajar BC dengan AD : AB = 1 : 3 dan luas segitiga ABC 72 cm². Perbandingan luas 1 : 9, jadi luas segitiga ADE 72 ÷ 9 = 8 cm².</div><label class="got" for="x-6-3-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-6-3-6"><div class="extext">DE sejajar BC dengan AD : DB = 2 : 3 dan DE = 6 cm. Maka AD : AB = 2 : 5, jadi BC = 6 × 5 ÷ 2 = 15 cm.</div><label class="got" for="x-6-3-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-6-3-7"><div class="extext">Siswa setinggi 150 cm berbayangan 100 cm. Pada saat yang sama, bayangan menara di Kendal 20 m. Tinggi menara 150 ÷ 100 × 20 = 30 m.</div><label class="got" for="x-6-3-7"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Cocokkan titik-titik yang bersesuaian dengan benar: sisi terpendek dengan sisi terpendek, sudut terbesar dengan sudut terbesar. Pada AD : DB = 2 : 3, bagian dari AB adalah 2 : (2 + 3), bukan 2 : 3.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Cukup satu dari tiga syarat: sudut sama, sisi sebanding, atau dua sisi sebanding dengan sudut apit sama. Garis sejajar alas membentuk segitiga sebangun. BD² = AD × DC pada segitiga siku-siku.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 7 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7">Lanjut ke Bab 7</a></div></div></section></article><article class="panel" id="bab-7" style="--c:var(--c7)"><header class="chead"><div class="wrap"><h2>Bab 7. Data dan Diagram</h2><div class="intro"><p>Statistika membantu kita menjawab pertanyaan dengan data. Bab ini membahas langkah penelitian, jenis data, dan cara menyajikannya dengan diagram. Enam sub-bab: investigasi statistika, macam data, diagram dalam statistika, diagram batang, diagram lingkaran, dan memilih diagram yang tepat.</p></div><p class="meta">6 sub-bab dan 34 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-7-1" href="#bab-7-1">7.1 Investigasi Statistika<span class="donemark">selesai</span></a><a class="stab stab-7-2" href="#bab-7-2">7.2 Macam-Macam Data<span class="donemark">selesai</span></a><a class="stab stab-7-3" href="#bab-7-3">7.3 Diagram dalam Statistika<span class="donemark">selesai</span></a><a class="stab stab-7-4" href="#bab-7-4">7.4 Diagram Batang<span class="donemark">selesai</span></a><a class="stab stab-7-5" href="#bab-7-5">7.5 Diagram Lingkaran<span class="donemark">selesai</span></a><a class="stab stab-7-6" href="#bab-7-6">7.6 Memilih Diagram yang Tepat<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-7-1"><div class="wrap"><h3 class="st">7.1 Investigasi Statistika</h3><p class="idea"><strong>Ide pokok.</strong> Investigasi statistika adalah cara berurutan untuk menjawab pertanyaan menggunakan data.</p>
<h4 class="lab">Empat langkah</h4>
<ol class="steps"><li><strong>Merumuskan pertanyaan</strong>, misalnya: berapa lama siswa kelas VII belajar di rumah tiap hari?</li><li><strong>Mengumpulkan data</strong> (wawancara, angket, pengukuran).</li><li><strong>Menyajikan data</strong> dalam tabel atau diagram.</li><li><strong>Menganalisis dan menarik kesimpulan</strong>.</li></ol>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Populasi</strong>: seluruh objek yang ingin diketahui. <strong>Sampel</strong>: sebagian populasi yang diamati.</li><li><strong>Sensus</strong>: mendata seluruh anggota populasi.</li><li>Sampel yang baik dipilih <strong>acak</strong>, supaya mewakili populasi. Sampel yang hanya diambil dari teman dekat atau anggota satu kelompok bisa menimbulkan <strong>bias</strong> (hasil condong ke satu arah).</li><li>Pertanyaan statistika mengantisipasi variasi jawaban dari banyak orang. "Berapa uang saku siswa kelas VII tiap hari?" adalah pertanyaan statistika. "Berapa uang saku Dimas hari ini?" bukan.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-1-1"><div class="extext">SMP Negeri 3 Kaliwungu punya 600 siswa dan 60 di antaranya disurvei. Populasinya 600 siswa dan sampelnya 60 siswa.</div><label class="got" for="x-7-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-1-2"><div class="extext">Dari 40 siswa sampel acak, 10 siswa naik angkot. Untuk populasi 800 siswa, perkiraan yang naik angkot 10 ÷ 40 × 800 = 200 siswa.</div><label class="got" for="x-7-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-1-3"><div class="extext">Untuk memperkirakan jumlah ikan di tambak, ditandai 50 ikan lalu dilepas. Kemudian ditangkap 40 ikan dan 5 di antaranya bertanda. Perbandingan 5/40 sama dengan 50/N, jadi N = 400 ekor.</div><label class="got" for="x-7-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-1-4"><div class="extext">Kelas 7A (20 siswa) rata-rata nilai 80 dan kelas 7B (30 siswa) rata-rata 70. Rata-rata gabungan (20 × 80 + 30 × 70) ÷ 50 = 3.700 ÷ 50 = 74. Bukan (80 + 70) ÷ 2 = 75, karena jumlah siswanya berbeda.</div><label class="got" for="x-7-1-4"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Mewawancarai hanya anggota OSIS untuk mengetahui uang saku seluruh siswa menghasilkan sampel yang bias. Rata-rata dua kelompok yang jumlahnya berbeda tidak boleh dirata-ratakan begitu saja.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Rumuskan, kumpulkan, sajikan, simpulkan. Sampel harus acak dan mewakili populasi.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 4 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7-2">Lanjut ke 7.2 Macam-Macam Data</a></div></div></section><section class="sec" id="bab-7-2"><div class="wrap"><h3 class="st">7.2 Macam-Macam Data</h3><p class="idea"><strong>Ide pokok.</strong> Jenis data menentukan cara mengolah dan menyajikannya.</p>
<div class="tw"><table><thead><tr><th>Jenis</th><th>Penjelasan</th><th>Contoh</th></tr></thead><tbody><tr><td>Kategorik nominal</td><td>label tanpa urutan</td><td>warna kesukaan, hobi, jenis ikan</td></tr><tr><td>Kategorik ordinal</td><td>label dengan urutan</td><td>ukuran baju S, M, L; juara 1, 2, 3</td></tr><tr><td>Numerik diskrit</td><td>hasil menghitung (bilangan bulat)</td><td>banyak saudara, banyak gol</td></tr><tr><td>Numerik kontinu</td><td>hasil mengukur (bisa pecahan)</td><td>tinggi badan, berat ikan, suhu</td></tr></tbody></table></div>
<ul class="pts"><li><strong>Data primer</strong>: dikumpulkan sendiri (mengukur sendiri, mewawancarai langsung).</li><li><strong>Data sekunder</strong>: diperoleh dari pihak lain (BPS, laporan dinas, buku).</li><li>Rata-rata hanya bermakna untuk data numerik. Tidak ada gunanya mencari rata-rata warna kesukaan.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-2-1"><div class="extext">"Banyak buku di tas" adalah data numerik diskrit, karena didapat dengan menghitung.</div><label class="got" for="x-7-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-2-2"><div class="extext">"Waktu tempuh ke sekolah" adalah data numerik kontinu, karena didapat dengan mengukur.</div><label class="got" for="x-7-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-2-3"><div class="extext">"Tingkat kepuasan (puas, biasa, kurang)" adalah data kategorik ordinal, karena ada urutan.</div><label class="got" for="x-7-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-2-4"><div class="extext">Rina menimbang sendiri 20 ikan. Itu data primer.</div><label class="got" for="x-7-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-7-2-5"><div class="extext">Dimas mengutip data penduduk dari situs BPS. Itu data sekunder.</div><label class="got" for="x-7-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-7-2-6"><div class="extext">Tinggi badan Rina dicatat 150 cm setelah dibulatkan ke cm terdekat. Tinggi sebenarnya t memenuhi 149,5 ≤ t &lt; 150,5.</div><label class="got" for="x-7-2-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-7-2-7"><div class="extext">Banyak siswa hadir tiap hari bervariasi dari 28 sampai 35 (diskrit). Banyak nilai yang mungkin: 28, 29, ..., 35, yaitu 8 nilai.</div><label class="got" for="x-7-2-7"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Peringkat lomba (juara 1, 2, 3) termasuk data ordinal, bukan numerik, karena angkanya hanya menunjukkan urutan. Jangan menyamakan "menghitung" (diskrit) dengan "mengukur" (kontinu).</p></details>
<p class="sum"><strong>Ringkasan.</strong> Kategorik: label. Numerik diskrit: menghitung. Numerik kontinu: mengukur. Primer: sendiri. Sekunder: pihak lain.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 7 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7-3">Lanjut ke 7.3 Diagram dalam Statistika</a></div></div></section><section class="sec" id="bab-7-3"><div class="wrap"><h3 class="st">7.3 Diagram dalam Statistika</h3><p class="idea"><strong>Ide pokok.</strong> Diagram mengubah deretan angka menjadi gambar yang mudah dibaca.</p>
<div class="tw"><table><thead><tr><th>Diagram</th><th>Cocok untuk</th></tr></thead><tbody><tr><td>Diagram batang</td><td>membandingkan nilai antar kategori</td></tr><tr><td>Diagram garis</td><td>melihat perubahan data dari waktu ke waktu</td></tr><tr><td>Diagram lingkaran</td><td>melihat bagian terhadap keseluruhan</td></tr><tr><td>Piktogram</td><td>menyajikan data dengan gambar sederhana</td></tr></tbody></table></div>
<h4 class="lab">Cara menghitung dari data</h4>
<ul class="pts"><li>Jumlah = semua nilai ditambahkan.</li><li>Rata-rata = jumlah ÷ banyak data.</li><li>Selisih tertinggi dan terendah = nilai terbesar − nilai terkecil.</li><li>Pada tabel frekuensi, rata-rata = jumlah (nilai × frekuensi) ÷ jumlah frekuensi.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-3-1"><div class="extext">Penjualan kerupuk (ratusan bungkus) Senin sampai Jumat: 5, 8, 6, 9, 7. Hari tertinggi adalah Kamis (9). Selisih tertinggi dan terendah 9 − 5 = 4. Jumlah 35, dan rata-rata 35 ÷ 5 = 7.</div><label class="got" for="x-7-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-3-2"><div class="extext">Tabel nilai ulangan 20 siswa: nilai 6 ada 2 siswa, nilai 7 ada 5 siswa, nilai 8 ada 8 siswa, nilai 9 ada 5 siswa. Rata-rata = (6×2 + 7×5 + 8×8 + 9×5) ÷ 20 = (12 + 35 + 64 + 45) ÷ 20 = 156 ÷ 20 = 7,8.</div><label class="got" for="x-7-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-3-3"><div class="extext">Piktogram panen bandeng dengan 1 gambar ikan = 10 ekor. Pak Slamet 4 gambar dan Bu Sri 7 gambar. Selisih panen 3 × 10 = 30 ekor.</div><label class="got" for="x-7-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-3-4"><div class="extext">Menyajikan perubahan suhu tiap jam di Kendal: pilih diagram garis. Menyajikan jumlah siswa tiap ekstrakurikuler: pilih diagram batang.</div><label class="got" for="x-7-3-4"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Pada tabel frekuensi, bagi dengan jumlah frekuensi (jumlah semua siswa), bukan dengan banyaknya baris. Pada piktogram, perhatikan nilai satu gambar.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Batang: bandingkan. Garis: perubahan waktu. Lingkaran: bagian dari keseluruhan. Piktogram: gambar. Rata-rata = jumlah ÷ banyak data.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 4 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7-4">Lanjut ke 7.4 Diagram Batang</a></div></div></section><section class="sec" id="bab-7-4"><div class="wrap"><h3 class="st">7.4 Diagram Batang</h3><p class="idea"><strong>Ide pokok.</strong> Tinggi batang menunjukkan besarnya nilai. Makin tinggi batang, makin besar nilainya.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Sumbu mendatar berisi kategori (misalnya hari). Sumbu tegak berisi nilai atau frekuensi.</li><li>Semua batang berlebar sama dan berjarak sama.</li><li>Sumbu tegak sebaiknya dimulai dari 0 agar perbandingan tidak menyesatkan.</li><li>Ada batang tunggal, batang ganda (membandingkan dua kelompok), dan batang bertumpuk.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<p>Penjualan kerupuk di Pasar Weleri (puluhan bungkus):</p>
<div class="tw"><table><thead><tr><th>Hari</th><th>Sen</th><th>Sel</th><th>Rab</th><th>Kam</th><th>Jum</th></tr></thead><tbody><tr><td>Nilai</td><td>6</td><td>10</td><td>8</td><td>9</td><td>7</td></tr></tbody></table></div>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-4-1"><div class="extext">Batang tertinggi hari Selasa (10).</div><label class="got" for="x-7-4-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-4-2"><div class="extext">Jumlah seluruh penjualan 6 + 10 + 8 + 9 + 7 = 40 puluh bungkus, atau 400 bungkus.</div><label class="got" for="x-7-4-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-4-3"><div class="extext">Rata-rata per hari 40 ÷ 5 = 8 puluh bungkus.</div><label class="got" for="x-7-4-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-4-4"><div class="extext">Hari di atas rata-rata (lebih dari 8): Selasa (10) dan Kamis (9), jadi 2 hari.</div><label class="got" for="x-7-4-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-7-4-5"><div class="extext">Selisih hari Selasa dan Senin 10 − 6 = 4 puluh bungkus.</div><label class="got" for="x-7-4-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-7-4-6"><div class="extext">Persentase penjualan Selasa terhadap seluruhnya 10 ÷ 40 × 100% = 25%.</div><label class="got" for="x-7-4-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-7-4-7"><div class="extext">Jika data hari Senin dihapus, rata-rata empat hari sisanya (40 − 6) ÷ 4 = 8,5.</div><label class="got" for="x-7-4-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-7-4-8"><div class="extext">Target seminggu (Senin sampai Sabtu) 48 puluh bungkus. Penjualan Sabtu harus 48 − 40 = 8 puluh bungkus.</div><label class="got" for="x-7-4-8"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Baca nilai tepat di ujung batang pada sumbu tegak. Jika sumbu tegak tidak mulai dari 0, batang yang pendek tampak jauh lebih kecil dari sebenarnya.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Tinggi batang = nilai. Jumlahkan batang untuk total, bagi banyak batang untuk rata-rata.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 8 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7-5">Lanjut ke 7.5 Diagram Lingkaran</a></div></div></section><section class="sec" id="bab-7-5"><div class="wrap"><h3 class="st">7.5 Diagram Lingkaran</h3><p class="idea"><strong>Ide pokok.</strong> Satu lingkaran penuh mewakili keseluruhan data. Tiap irisan (juring) mewakili satu bagian.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Seluruh lingkaran = 100% = 360°.</li><li>Persentase = (frekuensi ÷ total) × 100%.</li><li>Sudut juring = (frekuensi ÷ total) × 360°.</li><li>Dari sudut ke persen: persen = sudut ÷ 360° × 100%. Cara cepat: 1% = 3,6°.</li><li>Jumlah semua persentase 100%, dan jumlah semua sudut 360°.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-5-1"><div class="extext">Juring mewakili 15% data. Sudutnya 15 × 3,6° = 54°.</div><label class="got" for="x-7-5-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-5-2"><div class="extext">Juring bersudut 90° mewakili 90 ÷ 360 × 100% = 25%.</div><label class="got" for="x-7-5-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-5-3"><div class="extext">Dari 40 siswa, 10 suka bakso. Sudut juring bakso 10 ÷ 40 × 360° = 90°.</div><label class="got" for="x-7-5-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-5-4"><div class="extext">Juring pramuka bersudut 60°, dan seluruh siswa 120 orang. Siswa pramuka 60 ÷ 360 × 120 = 20 siswa.</div><label class="got" for="x-7-5-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-7-5-5"><div class="extext">Uang saku Rina Rp120 ribu per bulan. Juring jajan bersudut 90°, jadi uang jajan 90 ÷ 360 × 120 = 30 ribu rupiah.</div><label class="got" for="x-7-5-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-7-5-6"><div class="extext">Dari 72 siswa, 18 suka bakso, 24 suka soto, dan sisanya suka nasi goreng. Nasi goreng 72 − 18 − 24 = 30 siswa, sudutnya 30 ÷ 72 × 360° = 150°.</div><label class="got" for="x-7-5-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-7-5-7"><div class="extext">Juring terkecil bersudut 40° dan mewakili 4 siswa. Seluruh siswa 360 ÷ 40 × 4 = 36 siswa.</div><label class="got" for="x-7-5-7"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Sudut dihitung dari 360°, bukan dari 180° atau 100°. Setelah selesai, jumlahkan semua sudut: hasilnya harus tepat 360°.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Sudut juring = bagian ÷ total × 360°. Persen = bagian ÷ total × 100%. 1% = 3,6°.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 7 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-7-6">Lanjut ke 7.6 Memilih Diagram yang Tepat</a></div></div></section><section class="sec" id="bab-7-6"><div class="wrap"><h3 class="st">7.6 Memilih Diagram yang Tepat</h3><p class="idea"><strong>Ide pokok.</strong> Pilih diagram menurut tujuan, bukan menurut selera.</p>
<div class="tw"><table><thead><tr><th>Tujuan penyajian</th><th>Diagram yang tepat</th><th>Contoh</th></tr></thead><tbody><tr><td>Perubahan dari waktu ke waktu</td><td>Diagram garis</td><td>suhu tiap bulan, harga cabai tiap minggu</td></tr><tr><td>Membandingkan antar kategori</td><td>Diagram batang</td><td>jumlah peminat tiap ekstrakurikuler</td></tr><tr><td>Bagian terhadap keseluruhan</td><td>Diagram lingkaran</td><td>rincian pengeluaran uang saku</td></tr><tr><td>Data dengan gambar sederhana</td><td>Piktogram</td><td>banyak kendaraan dengan gambar kecil</td></tr><tr><td>Membandingkan dua kelompok</td><td>Diagram batang ganda</td><td>nilai kelas 7A dan 7B tiap mata pelajaran</td></tr></tbody></table></div>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-7-6-1"><div class="extext">Rina mencatat ekskul pilihan 60 siswa dan ingin membandingkan peminat tiap ekskul. Diagram batang paling tepat.</div><label class="got" for="x-7-6-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-7-6-2"><div class="extext">Suhu rata-rata di Kendal dicatat tiap bulan selama 12 bulan untuk melihat kecenderungannya. Diagram garis paling tepat.</div><label class="got" for="x-7-6-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-7-6-3"><div class="extext">Rincian pengeluaran Rp500 ribu per bulan (makan, transportasi, pulsa, tabungan) sebagai bagian dari keseluruhan. Diagram lingkaran paling tepat.</div><label class="got" for="x-7-6-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-7-6-4"><div class="extext">Nilai 5 mata pelajaran kelas 7A dan 7B ingin dibandingkan dalam satu diagram. Diagram batang ganda paling tepat.</div><label class="got" for="x-7-6-4"><span></span></label></li></ol>
<h4 class="lab">Kesalahan yang membuat diagram menyesatkan</h4>
<ul class="pts"><li>Sumbu tegak diagram batang tidak dimulai dari 0. Selisih antar batang tampak lebih besar dari sebenarnya.</li><li>Diagram lingkaran dengan terlalu banyak kategori (misalnya 10). Juring sempit sulit dibaca dan dibandingkan.</li><li>Memakai diagram garis untuk data kategori yang tidak berurutan waktu.</li></ul>
<p class="sum"><strong>Ringkasan.</strong> Waktu: garis. Perbandingan: batang. Bagian dari keseluruhan: lingkaran. Gambar: piktogram. Jaga agar diagram jujur dan mudah dibaca.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 4 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#penutup">Lanjut ke rangkuman</a></div></div></section></article>
<section class="panel" id="penutup" style="--c:#B8C4CE">
<header class="chead"><div class="wrap"><h2>Rangkuman rumus dan kesalahan umum</h2></div></header>
<div class="wrap guide"><p>Gunakan bagian ini untuk mengulang cepat sebelum ulangan. Jika ada rumus yang terasa asing, buka kembali sub-bab asalnya.</p>
<h3 class="grp">Rumus dan aturan kunci</h3>
<div class="tw"><table><thead><tr><th>Bab</th><th>Yang perlu diingat</th></tr></thead><tbody><tr><td>1. Bilangan bulat</td><td>a − (−b) = a + b. Tanda sama menghasilkan positif, tanda berbeda menghasilkan negatif. a × b = FPB × KPK.</td></tr><tr><td>2. Bilangan rasional</td><td>Titik tengah = (a + b) ÷ 2. Perkalian silang untuk membandingkan. Bagi pecahan = kali kebalikan.</td></tr><tr><td>3. Rasio</td><td>Bagian pertama = a/(a + b) × total. Jarak asli = jarak peta × penyebut skala. Kecepatan = jarak ÷ waktu. km/jam × 5/18 = m/s.</td></tr><tr><td>4. Himpunan</td><td>n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Banyak himpunan bagian = 2ⁿ.</td></tr><tr><td>5. Aljabar</td><td>a(b + c) = ab + ac. (m + n)² = m² + 2mn + n². Untuk ax + b = c, x = (c − b) ÷ a.</td></tr><tr><td>6. Kesebangunan</td><td>Pelurus 180°, penyiku 90°, segitiga 180°. Keliling berbanding k, luas berbanding k². BD² = AD × DC.</td></tr><tr><td>7. Data</td><td>Rata-rata = jumlah ÷ banyak data. Sudut juring = bagian ÷ total × 360°.</td></tr></tbody></table></div>
<h3 class="grp">Kesalahan yang paling sering terjadi</h3>
<ul class="pts"><li>Menganggap −9 lebih besar dari −3. Pada bilangan negatif, urutannya terbalik.</li><li>Menjumlahkan penyebut saat menambah pecahan (1/2 + 1/3 bukan 2/5).</li><li>Memakai cara senilai pada soal berbalik nilai, atau sebaliknya.</li><li>Lupa menyamakan satuan sebelum menghitung skala, kecepatan, atau debit.</li><li>Menulis (x + 4)² = x² + 16 dan melupakan suku tengah 2mn.</li><li>Mengira penambahan sisi yang sama (+2 pada panjang dan lebar) menghasilkan bangun sebangun.</li><li>Tidak mengurangi irisan saat menghitung n(A ∪ B).</li><li>Tidak memeriksa jawaban ke dalam soal cerita.</li></ul>
<h3 class="grp">Langkah selanjutnya</h3>
<ol class="steps"><li>Kerjakan Level 1 sampai nilai di atas 70 pada setiap sub-bab, lalu naik ke Level 2 dan Level 3.</li><li>Lihat halaman Progress di MathLab 7 untuk mengetahui sub-bab mana yang akurasinya masih rendah.</li><li>Ulangi sub-bab terlemah: baca modul, tiru contoh, lalu latihan lagi.</li><li>Sebelum ulangan, pakai fitur <strong>Ulangan</strong> dengan campuran bab agar terbiasa berganti topik.</li></ol></div></section>

(()=>{

// Tema terang dan gelap

document.addEventListener('change',e=>{if(e.target.matches('.exc'))update()});

    .map(r=>'<div><small>'+r[0]+'</small><b>'+r[1]+'</b></div>').join('');
};
ra.oninput=rb.oninput=draw;draw();
})();
<\/script>

<script>
let LV=1;const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*((b-a)*[.6,.8,1][LV-1]+1)),pick=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):a,fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d==1?''+n:n+'/'+d},fmt=n=>(Math.round(n*100)/100).toString().replace('.',','),p=x=>x<0?`(${x})`:x;
function Q(q,a,e,w,g){const f=x=>typeof x=='number'?fmt(x):''+x;a=f(a);const n=parseFloat(a.replace(',','.'));w=(w||[1,-1,2,-2,10,-10].map(d=>n+d)).map(f);w=[...new Set(w)].filter(x=>x!=a&&(n<0||isNaN(n)||x[0]!='-'));const sf=a.endsWith('%')?'%':'';for(let d=3;w.length<3&&!isNaN(n)&&/^-?[\d,.]+%?$/.test(a)&&d<40;d++){const x=f(n+d)+sf;if(x!=a&&!w.includes(x))w.push(x)}return{q,a,e:e||'Jawaban yang tepat adalah '+a+'. Baca lagi ringkasan materinya.',g:g||'',o:sh([a,...sh(w).slice(0,3)])}}
