<!doctype html><html lang="id" data-theme="ocean"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Matematika SMP Kelas 7</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Playfair+Display:wght@700;800&family=Orbitron:wght@700;800&family=Inter:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10231f;--bg:#f2f7f5;--card:#fff;--ln:#d9e5e0;--y:#f5a524;--g:#16a34a;--r:#e5484d;--b:#0f766e;--bt:#fff;--m:#587069;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8f3ef;--bg:#0b1714;--card:#13251f;--ln:#244039;--b:#2dd4bf;--bt:#04201c;--m:#9bb5ad}}
:root[data-theme=dark]{--ink:#e8f3ef;--bg:#0b1714;--card:#13251f;--ln:#244039;--b:#2dd4bf;--bt:#04201c;--m:#9bb5ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,.big,.q{font-family:Sora,'DM Sans',sans-serif;margin:0;line-height:1.25}h1{font-size:1.6rem}h2{font-size:1.15rem;margin:24px 0 10px}
#sb{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:10px max(16px,calc(50% - 440px));background:var(--bg);border-bottom:1px solid var(--ln);overflow-x:auto}
#sb .lg{font:700 1.1rem Sora,sans-serif;margin-right:auto;white-space:nowrap}#sb .lg i{font-style:normal;color:var(--b)}
#sb button{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--m);white-space:nowrap}#sb button.on{background:var(--b);color:var(--bt)}
main{max-width:880px;margin:0 auto;padding:22px 16px 56px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}
.big{font-size:1.8rem;font-weight:700}.mu{color:var(--m);font-size:.9rem}
.hero{padding:22px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0f766e,#34b27b);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.hero p{margin:6px 0 0;opacity:.92}.lv{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;font:700 1.3rem Sora,sans-serif;white-space:nowrap}
.btn{all:unset;cursor:pointer;background:var(--b);color:var(--bt);font-weight:700;padding:11px 20px;border-radius:99px;display:inline-block;text-align:center}.btn:focus-visible,.opt:focus-visible,#sb button:focus-visible{outline:3px solid var(--y)}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}.btn.y{background:var(--y);color:#2b1c00}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.opt{all:unset;display:block;cursor:pointer;width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:14px 18px;margin-bottom:10px;font-weight:500;background:var(--card)}
.opt:hover{border-color:var(--b)}.opt.ok{border-color:var(--g);background:rgba(22,163,74,.15)}.opt.no{border-color:var(--r);background:rgba(229,72,77,.14)}
.q{font-size:1.15rem;font-weight:600;line-height:1.5;margin:10px 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.fb{border-radius:14px;padding:12px 16px;margin:8px 0}.fb.ok{background:rgba(22,163,74,.15)}.fb.no{background:rgba(229,72,77,.14)}
.inp{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:500 1.05rem 'DM Sans',sans-serif;margin:12px 0}
details{margin:8px 0}summary{cursor:pointer;color:var(--b);font-weight:600}table{border-collapse:collapse;margin:6px auto}td{padding:6px 18px;border:1px solid var(--ln)}
.gfx{text-align:center;margin:6px auto;max-width:360px;color:var(--ink)}.gfx svg{max-width:100%;height:auto}
@media(max-width:800px){.hero{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root[data-theme=light]{--bg:#fff8e7;--ink:#2d2a4a;--card:#fff;--ln:#f0dfb8;--b:#ff7a45;--bt:#fff;--m:#6b6785;--g:#2bb673;--y:#ffc233;--r:#ef5b5b}
body{font-family:Nunito,system-ui,sans-serif;font-size:18px;font-weight:600;background:var(--bg) radial-gradient(circle at 20px 20px,#ffe9a8 3px,transparent 4px) 0 0/44px 44px}
h1,h2,.big,.q,#sb .lg,.lv,.btn{font-family:Fredoka,Nunito,sans-serif}
.card{border:3px solid var(--ln);border-radius:26px;box-shadow:0 5px 0 var(--ln)}
.btn{border-radius:20px;padding:14px 22px;font-size:1.05rem;box-shadow:0 5px 0 #c8501f}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c8501f}
.btn.s{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ln)}.btn.y{background:var(--y);box-shadow:0 5px 0 #c98f00}
.btn.lvb{display:inline-flex;flex-direction:column;align-items:center;min-width:130px}.btn.lvb small{font:700 .8rem Nunito}.lvb.l1{background:#2bb673;box-shadow:0 5px 0 #1a8a54}.lvb.l2{background:#3b9cff;box-shadow:0 5px 0 #1f6fc4}.lvb.l3{background:#9b5de5;box-shadow:0 5px 0 #6d35b0}
.opt{border:3px solid var(--ln);border-radius:20px;padding:16px 20px;font-size:1.15rem;box-shadow:0 4px 0 var(--ln)}
.q{font-size:1.4rem}.hero{background:linear-gradient(135deg,#ff7a45,#ffb347);border-radius:30px}.hero::after{content:"🦌";font-size:4rem}
.bar{height:16px;border-radius:12px}.bar i{background:repeating-linear-gradient(45deg,#2bb673,#2bb673 10px,#4cd698 10px,#4cd698 20px)}
#sb{background:#ffe08a}#sb button.on{background:var(--b);color:#fff}.ex{background:#fff3c9;border-radius:14px;padding:10px 14px}.tw{overflow-x:auto}


/* tema ceria kelas 7 */
.card h1{background:linear-gradient(90deg,#ff7a45,#9b5de5,#3b9cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bab{position:relative;transition:transform .15s}.bab:hover{transform:translateY(-4px) rotate(-.4deg)}
.bab.b1{background:#fff1e6}.bab.b2{background:#e8f5ff}.bab.b3{background:#eafaf0}.bab.b4{background:#f3ecff}.bab.b5{background:#fff8d6}.bab.b6{background:#ffeaf2}.bab.b7{background:#e6fbf7}
.bab .big{font-size:1.4rem}
h2.sem{font-family:Fredoka,Nunito,sans-serif;background:linear-gradient(90deg,#ff7a45,#ffc233);color:#fff;padding:10px 20px;border-radius:20px;display:inline-block;margin:28px 0 12px;box-shadow:0 4px 0 #c98f00}
.mark{margin:12px 0;padding:10px 16px;border-radius:18px;border:3px dashed #f0c14b;background:#fffbe6;text-align:center;font-weight:800;color:#a06a00}
.hero{background:linear-gradient(135deg,#ff7a45,#ffb347 50%,#ffd93d)}
#sb{border-bottom:5px solid;border-image:linear-gradient(90deg,#ff7a45,#ffc233,#2bb673,#3b9cff,#9b5de5) 1}
@keyframes pop{0%{transform:scale(.94);opacity:.6}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card{animation:pop .35s ease both}.opt.ok{animation:pop .4s}.opt.no{animation:shk .35s}.opt:hover{transform:translateY(-2px)}
.lbl{display:block;text-align:left;font-weight:800;font-size:.9rem;color:var(--m);margin:6px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}.chip{display:inline-flex;align-items:center;background:#fff3c4;border:2px solid #f0c14b;border-radius:99px;overflow:hidden}.chip button{border:0;background:none;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer}.chip b{padding:8px 10px;cursor:pointer;color:#a06a00}.chip b:hover{background:#ffd93d}#syn{padding:4px 12px;font-size:.8rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== tema royal: midnight + emas ===== */
:root[data-theme=light]{--bg:#faf5ea;--ink:#1c1840;--card:#fffdf8;--ln:#eadfc2;--b:#4a2fbd;--bt:#fff;--m:#6a6585;--g:#1fae6b;--y:#e8b53a;--r:#e5484d;--gold:linear-gradient(135deg,#f6d77a,#d4a017 55%,#b8860b)}
body{background:var(--bg);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
body::before{top:-20vmax;left:-15vmax;background:radial-gradient(circle,#c9b6ff,transparent 65%)}
body::after{bottom:-25vmax;right:-15vmax;background:radial-gradient(circle,#ffd98a,transparent 65%);animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1,h2,#sb .lg{font-family:'Playfair Display',Georgia,serif;font-weight:800}
h2.sem{font-family:Fredoka,Nunito,sans-serif;background:linear-gradient(90deg,#2d1b69,#6a3df0);color:#f6d77a;box-shadow:0 4px 0 #1a1245}

#sb{position:sticky;background:linear-gradient(90deg,#1a1245,#2d1b69 60%,#1a1245);border:0;border-image:none;box-shadow:0 8px 26px rgba(26,18,69,.4)}
#sb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
#sb .lg{color:#fff}#sb .lg i{background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#sb button{color:#cfc8ee;transition:.2s}#sb button:hover{color:#fff;background:rgba(255,255,255,.12)}
#sb button.on{background:var(--gold);color:#2a1d00;box-shadow:0 0 18px rgba(232,181,58,.55)}#sb .mu{color:#cfc8ee}
.card{background:linear-gradient(180deg,#fffefb,#fff9ec);border:1px solid #ecdcae;border-radius:24px;box-shadow:0 10px 30px -12px rgba(60,40,140,.25),inset 0 1px 0 #fff;transition:transform .25s,box-shadow .25s}
.card:hover{box-shadow:0 18px 40px -14px rgba(60,40,140,.35)}
.card h1{background:linear-gradient(90deg,#2d1b69,#7a4dff,#c9962b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid .card:hover,.bab:hover{transform:translateY(-6px)}
.bab{border-left:6px solid #d4a017}
.hero{background:linear-gradient(135deg,#1a1245,#3a1f9a 55%,#6a3df0);color:#fff;border:1px solid rgba(246,215,122,.5);border-radius:30px;position:relative;overflow:hidden;box-shadow:0 20px 50px -18px rgba(58,31,154,.7)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(246,215,122,.22) 48%,transparent 66%);transform:translateX(-100%);animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.hero::after{animation:flo 4s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-8px) rotate(6deg)}}
.lv{background:var(--gold);color:#2a1d00;box-shadow:0 0 22px rgba(246,215,122,.6)}
.btn{background:linear-gradient(135deg,#3b27a8,#6a3df0);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 #231570,0 12px 24px -8px rgba(74,47,189,.6);transition:transform .15s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.btn:hover::after{left:130%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #231570}
.btn.s{background:#fff;color:var(--ink);border:1.5px solid #e2d3a4;box-shadow:0 4px 0 #eadfc2}
.btn.y{background:var(--gold);color:#2a1d00;box-shadow:0 6px 0 #8a6508,0 12px 24px -8px rgba(212,160,23,.6)}
.btn.dng{background:linear-gradient(135deg,#e5484d,#b4232a);color:#fff;box-shadow:0 6px 0 #7d1319}
.btn.lvb.l1{background:linear-gradient(135deg,#1fae6b,#52d69a);box-shadow:0 6px 0 #14804d}
.btn.lvb.l2{background:linear-gradient(135deg,#2f80ed,#56b4ff);box-shadow:0 6px 0 #1f5fb5}
.btn.lvb.l3{background:linear-gradient(135deg,#7b3fe4,#b583ff);box-shadow:0 6px 0 #54299f}
.bar{background:#efe6cc;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bar i{background:linear-gradient(90deg,#d4a017,#f6d77a,#d4a017);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s}
@keyframes shim{to{background-position:-200% 0}}
.mark{border-color:#d4a017;background:#fff8e1;color:#7a5600}
.opt{border:2px solid #e8dab0;border-radius:18px;box-shadow:none;transition:.2s}
.opt:hover{border-color:#6a3df0;box-shadow:0 8px 20px -8px rgba(106,61,240,.4);transform:translateY(-3px)}
.opt.ok{border-color:var(--g)}.opt.no{border-color:var(--r)}
.inp{border:1.5px solid #e2d3a4;background:#fffdf8}.inp:focus{outline:none;border-color:#6a3df0;box-shadow:0 0 0 4px rgba(106,61,240,.18)}
table tr:first-child td{background:#f6eed6}
.kel{border:2px dashed #e5484d;background:#fff5f5}.kel .row{gap:12px}
/* leaderboard */
.lbw{max-width:600px;margin:26px auto;padding:22px 16px 18px;border-radius:30px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#3a1f9a 0%,#1a1245 60%,#0d0828 100%);border:1px solid rgba(246,215,122,.55);box-shadow:0 30px 60px -20px rgba(26,18,69,.8),inset 0 0 60px rgba(246,215,122,.08);animation:pop .5s both}
.lbw::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;animation:tw 3s ease-in-out infinite alternate;background:radial-gradient(circle at 20% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 25%,#fff 0 1px,transparent 2px),radial-gradient(circle at 60% 10%,#f6d77a 0 1.5px,transparent 2.5px),radial-gradient(circle at 35% 40%,#fff 0 1px,transparent 2px),radial-gradient(circle at 90% 60%,#f6d77a 0 1px,transparent 2px)}
@keyframes tw{to{opacity:.25}}
.lbh{text-align:center;position:relative;margin-bottom:18px}.lbh span{font-size:2rem;display:block;animation:flo 3s ease-in-out infinite}
.lbh h2{margin:0;font-size:1.9rem;letter-spacing:3px;text-transform:uppercase;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lbh small{color:#cfc8ee;letter-spacing:2px;font-size:.75rem;text-transform:uppercase}
#lb{position:relative}#lb .mu{color:#cfc8ee}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:16px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;animation:up .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d)}.pd.ph{visibility:hidden}
@keyframes up{from{opacity:0;transform:translateY(60px)}}
.pcr{font-size:1.8rem;height:2.2rem;animation:flo 2.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #f6d77a)}
.pav{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.6rem 'Playfair Display',serif;color:#1a1245;margin:2px 0 6px;border:3px solid #fff}
.pav i{position:absolute;right:-10px;bottom:-8px;font-size:1.5rem;font-style:normal}
.p1 .pav{width:84px;height:84px;font-size:2.1rem;background:var(--gold);box-shadow:0 0 0 4px rgba(246,215,122,.35),0 0 40px rgba(246,215,122,.8);animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(246,215,122,.2),0 0 60px rgba(246,215,122,1)}}
.p2 .pav{background:linear-gradient(135deg,#f4f6fa,#a9b3c4);box-shadow:0 0 24px rgba(200,210,230,.6)}
.p3 .pav{background:linear-gradient(135deg,#f0c39a,#b86f35);box-shadow:0 0 24px rgba(205,127,50,.6)}
.pnm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}.p1 .pnm{font-size:1.1rem;color:#f6d77a}
.pcl{font-size:.68rem;color:#cfc8ee;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pxp{font:800 1.15rem Fredoka,sans-serif;margin:4px 0 6px}.pxp small{font-size:.65rem;margin-left:3px;opacity:.8}
.pbk{width:100%;display:grid;place-items:center;border-radius:14px 14px 0 0;font:800 2.2rem 'Playfair Display',serif;color:rgba(26,18,69,.85)}
.p1 .pbk{height:120px;background:linear-gradient(180deg,#f6d77a,#b8860b)}.p2 .pbk{height:88px;background:linear-gradient(180deg,#eef1f6,#9aa5b8)}.p3 .pbk{height:64px;background:linear-gradient(180deg,#f0b27a,#a8642b)}
.lr{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:8px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);animation:up .5s both;animation-delay:calc(.7s + var(--d));transition:.2s}
.lr:hover{background:rgba(246,215,122,.14);transform:translateX(4px)}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(246,215,122,.18);color:#f6d77a;font-size:.9rem}
.rn{flex:1;min-width:0;display:flex;flex-direction:column}.rn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn small{color:#cfc8ee;font-size:.72rem}.rx{color:#f6d77a;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

/* ===== 4 tema baru: ocean, synthwave, sakura, matrix ===== */
:root{--gold:linear-gradient(135deg,#f6d77a,#d4a017 55%,#b8860b)}
:root[data-theme=ocean]{--ink:#08303f;--bg:#e8f7fb;--card:#fff;--ln:#bfe6ef;--soft:#dff3f8;--b:#0891b2;--m:#4d7a89;--y:#f5b82e;--g:#12b886;--r:#ef5b5b;--bgr:linear-gradient(135deg,#0ea5e9,#14b8a6);--bsh:#0b6f8c;--bt:#fff;--sbg:linear-gradient(90deg,#063a5c,#0a5f8a 60%,#063a5c);--sbt:#bfe9f7;--sblg:#fff;--sbo:linear-gradient(135deg,#7dd3fc,#5eead4);--sbx:#053247;--hd:linear-gradient(135deg,#0369a1,#0891b2 55%,#14b8a6);--o1:#67e8f9;--o2:#5eead4;--lbg:radial-gradient(120% 80% at 50% 0%,#0e7490 0%,#063a5c 62%,#021b2e 100%);--fh:Fredoka,Nunito,sans-serif;--oo:.45;color-scheme:light}

<script type="text/html" id="modsrc"><!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Modul MathLab 7</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Konsep: satu bab = satu bidang warna penuh; navigasi lewat hash (:target), centang contoh lewat checkbox, tanpa JavaScript. */
:root{
  --bg:#EEF2F5;--surf:#FFFFFF;--surf2:#DFE7ED;--ink:#12202B;--ink2:#34475A;--acc:#1F5FE0;
  --on:#12202B;--hero:#12202B;--hero-ink:#F2F6F9;
  --c1:#FF7A59;--c2:#FFC24B;--c3:#7BC77E;--c4:#5CCFC0;--c5:#7FA8FF;--c6:#FF8FB1;--c7:#D9A66B;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --bar:60px;--sub:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E161D;--surf:#17232D;--surf2:#223241;--ink:#E8EEF3;--ink2:#B3C2CF;--acc:#8FB4FF;--hero:#17232D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E161D;--surf:#17232D;--surf2:#223241;--ink:#E8EEF3;--ink2:#B3C2CF;--acc:#8FB4FF;--hero:#17232D;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--body);padding-block:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--head);margin:0;text-wrap:balance}
p{margin:0 0 16px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* bilah atas */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.barin{display:flex;align-items:center;gap:20px;height:var(--bar)}
.brand{font:800 22px/1 var(--head);text-decoration:none;letter-spacing:-.02em;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font:700 16px/1 var(--body);text-decoration:none;background:var(--surf2);color:var(--ink);transition:transform .15s,background .15s}
.tab:hover{transform:translateY(-2px)}
.tab:active{transform:scale(.97)}
.tab:hover .sw{background:var(--on)}
.sw{width:10px;height:10px;background:var(--c);display:block}
.donemark{display:none;font:700 13px/1 var(--body);padding:3px 6px;background:var(--ink);color:var(--bg)}
.tab .donemark{padding:3px 5px;font-size:12px}

/* panel */
.panel{display:none;animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.panel:target,.panel:has(.sec:target){display:block}
.app:not(:has(.panel:target,.sec:target)) #petunjuk{display:block}
.panel,.sec{scroll-margin-top:calc(var(--bar) + env(safe-area-inset-top,0px))}
.sec{scroll-margin-top:calc(var(--bar) + var(--sub) + env(safe-area-inset-top,0px) + 8px)}

/* hero + petunjuk */
.hero{background:var(--hero);color:var(--hero-ink);padding-block:clamp(40px,8vw,104px) clamp(32px,5vw,64px)}
.hero h1{font-weight:800;font-size:clamp(44px,10vw,132px);line-height:.95;letter-spacing:-.04em}
.lede{font-size:22px;max-width:34ch;margin:24px 0 0;line-height:1.4}
.guide{padding-block:48px 80px}
.gh{font-weight:800;font-size:clamp(30px,5vw,56px);line-height:1;letter-spacing:-.03em;margin-bottom:20px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;margin:8px 0 48px}
.mapcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;background:var(--c);color:var(--on);text-decoration:none;transition:transform .18s;animation:rise .5s ease both;animation-delay:var(--d,0ms);min-height:190px}
.mapcard:hover{transform:translateY(-4px)}
.mapcard:active{transform:scale(.98)}
.mapcard h3{font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.mapcard p{margin:0;font-size:16px;line-height:1.4}
.mapcard .mc{margin-top:auto;font-weight:700}
.mapcard .donemark{position:absolute;top:14px;right:14px}
.grp{font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.1;margin:40px 0 16px;letter-spacing:-.02em}

/* kepala bab */
.chead{background:var(--c);color:var(--on);padding-block:clamp(40px,8vw,96px) clamp(28px,5vw,56px)}
.chead h2{font-weight:800;font-size:clamp(36px,7vw,92px);line-height:.98;letter-spacing:-.035em;max-width:20ch}
.intro{margin-top:24px;max-width:46ch;font-size:22px;line-height:1.4}
.intro p{margin:0}
.meta{margin:18px 0 0;font-weight:700;font-size:17px}

/* sub-bab */
.subbar{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg)}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;height:var(--sub);align-items:center}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surf2);color:var(--ink);text-decoration:none;font:700 16px/1.1 var(--body);transition:transform .15s}
.stab:hover{transform:translateY(-2px)}
.stab:active{transform:scale(.97)}
.sec{display:none;padding-block:36px 88px;animation:rise .45s ease both}
.sec:target{display:block}
.panel:target:not(:has(.sec:target)) .sec:first-of-type{display:block}
.st{font-weight:800;font-size:clamp(26px,4.4vw,52px);line-height:1.02;letter-spacing:-.03em;margin-bottom:24px;max-width:24ch}
.idea{font-size:22px;line-height:1.45;max-width:46ch;margin-bottom:32px}
.lab{font-weight:800;font-size:clamp(22px,3vw,30px);margin:40px 0 14px;letter-spacing:-.02em}

/* daftar */
.pts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;max-width:74ch}
.pts li{background:var(--surf);padding:14px 18px 14px 22px;border-left:8px solid var(--c)}
.steps{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;counter-reset:st;max-width:74ch}
.steps li{counter-increment:st;display:grid;grid-template-columns:36px 1fr;gap:14px;background:var(--surf);padding:14px 18px 14px 14px;align-items:start}
.steps li::before{content:counter(st);display:grid;place-items:center;width:36px;height:36px;background:var(--c);color:var(--on);font:800 18px/1 var(--head)}

/* contoh yang bisa dicentang */
.exs{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:12px;counter-reset:ex;grid-template-columns:1fr}
@media (min-width:900px){.exs{grid-template-columns:1fr 1fr}}
.ex{counter-increment:ex;position:relative;display:flex;flex-direction:column;gap:14px;background:var(--surf);padding:18px 18px 16px 70px;transition:background .2s,transform .15s;min-width:0}
.ex::before{content:counter(ex);position:absolute;left:16px;top:16px;width:40px;height:40px;display:grid;place-items:center;background:var(--surf2);font:800 20px/1 var(--head);transition:background .2s}
.ex:hover{transform:translateY(-2px)}
.extext{overflow-wrap:anywhere}
.exc{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.got{align-self:flex-start;display:inline-flex;cursor:pointer;padding:10px 14px;background:var(--surf2);color:var(--ink);font:700 15px/1 var(--body);transition:background .15s,transform .1s;user-select:none}
.got:hover{background:var(--c);color:var(--on)}
.got:active{transform:scale(.96)}
.got span::after{content:"Tandai sudah paham"}
.exc:checked ~ .got{background:var(--c);color:var(--on)}
.exc:checked ~ .got span::after{content:"Sudah paham"}
.exc:focus-visible ~ .got{outline:3px solid var(--acc);outline-offset:2px}
.ex:has(.exc:checked){background:color-mix(in srgb,var(--c) 22%,var(--surf))}
.ex:has(.exc:checked)::before{background:var(--c);color:var(--on)}

/* awas keliru + ringkasan */
.awas{margin:32px 0 12px;background:color-mix(in srgb,var(--c) 26%,var(--surf));max-width:74ch}
.awas summary{cursor:pointer;list-style:none;padding:16px 20px;font:800 20px/1.2 var(--head);display:flex;justify-content:space-between;gap:12px;align-items:center;transition:background .15s}
.awas summary::-webkit-details-marker{display:none}
.awas summary::after{content:"Buka";font:700 15px/1 var(--body);padding:8px 12px;background:var(--on);color:var(--hero-ink)}
.awas[open] summary::after{content:"Tutup"}
.awas summary:hover{background:color-mix(in srgb,var(--c) 40%,var(--surf))}
.awas p{margin:0;padding:0 20px 20px}
.sum{margin:12px 0 0;background:var(--c);color:var(--on);padding:20px 22px;max-width:74ch;font-size:19px}

<div class="hero"><div class="wrap"><h1>Matematika kelas 7</h1>
<p class="lede">Tujuh bab dan 22 sub-bab, lengkap dengan 149 contoh yang bisa kamu centang satu per satu.</p>
<section class="nl" aria-label="Garis bilangan interaktif"><h2>Geser a dan b di garis bilangan</h2><div class="nlc"><label>a = <output id="oa"></output><input id="ra" type="range" min="-10" max="10" value="-4"></label><label>b = <output id="ob"></output><input id="rb" type="range" min="-10" max="10" value="6"></label></div><div class="nlt"><i class="seg2"></i><i class="pt" id="pa">a</i><i class="pt" id="pb">b</i></div><div class="nlr" aria-live="polite"></div></section></div></div>
<div class="wrap guide"><h2 class="gh">Petunjuk Belajar</h2>
<p>Modul ini menemani kamu belajar 7 bab matematika kelas 7, dari bilangan sampai data. Bahasanya dibuat sederhana, dan setiap sub-bab mengikuti urutan yang sama supaya mudah diikuti.</p>
<div class="map"><a class="mapcard" href="#bab-1" style="--c:var(--c1);--d:0ms"><h3>Bab 1. Bilangan Bulat dan Pecahan</h3><p>Bilangan bulat, operasi, faktor, FPB, KPK</p><p class="mc">3 sub-bab, 14 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-2" style="--c:var(--c2);--d:60ms"><h3>Bab 2. Bilangan Rasional</h3><p>Bilangan di antara dua bilangan, membandingkan, operasi</p><p class="mc">3 sub-bab, 23 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-3" style="--c:var(--c3);--d:120ms"><h3>Bab 3. Rasio dan Perbandingan</h3><p>Rasio, skala, laju (kecepatan dan debit)</p><p class="mc">3 sub-bab, 24 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-4" style="--c:var(--c4);--d:180ms"><h3>Bab 4. Himpunan</h3><p>Jenis bilangan, diagram Venn, himpunan bagian</p><p class="mc">1 sub-bab, 9 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-5" style="--c:var(--c5);--d:240ms"><h3>Bab 5. Bentuk Aljabar</h3><p>Unsur, operasi, mengubah cerita menjadi persamaan</p><p class="mc">3 sub-bab, 24 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-6" style="--c:var(--c6);--d:300ms"><h3>Bab 6. Kesebangunan</h3><p>Hubungan sudut, bangun sebangun, segitiga sebangun</p><p class="mc">3 sub-bab, 21 contoh</p><span class="donemark">selesai</span></a><a class="mapcard" href="#bab-7" style="--c:var(--c7);--d:360ms"><h3>Bab 7. Data dan Diagram</h3><p>Statistika, jenis data, diagram batang dan lingkaran</p><p class="mc">6 sub-bab, 34 contoh</p><span class="donemark">selesai</span></a></div>
<h3 class="grp">Urutan tiap sub-bab</h3>
<ol class="steps"><li><strong>Ide pokok</strong>: inti materi dalam satu atau dua kalimat.</li><li><strong>Penjelasan</strong>: arti istilah dan aturan, dengan bahasa sehari-hari.</li><li><strong>Contoh bertahap</strong>: soal dikerjakan langkah demi langkah.</li><li><strong>Awas keliru</strong>: kesalahan yang paling sering terjadi.</li><li><strong>Ringkasan</strong>: hal yang perlu diingat sebelum latihan.</li></ol>
<h3 class="grp">Cara memakai modul bersama MathLab 7</h3>
<ol class="steps"><li>Baca bagian ide pokok dan penjelasan. Jangan terburu-buru; pahami dulu arti istilahnya.</li><li>Tutup jawaban contoh, coba kerjakan sendiri, lalu cocokkan.</li><li>Buka MathLab 7 dan tekan tombol <strong>Belajar</strong> pada sub-bab yang sama, lalu kerjakan latihan.</li><li>Mulai dari Level 1. Naik ke Level 2 jika nilai sudah di atas 70.</li><li>Catat soal yang salah. Ulangi sub-bab itu sampai kamu bisa menjelaskan alasannya kepada teman.</li></ol>
<h3 class="grp">Tiga level latihan</h3>
<div class="tw"><table><thead><tr><th>Level</th><th>Jenis soal</th><th>Tujuan</th></tr></thead><tbody><tr><td>1 Dasar</td><td>Hitungan langsung</td><td>Hafal aturan dan lancar menghitung</td></tr><tr><td>2 Kontekstual</td><td>Soal cerita sehari-hari</td><td>Mengubah cerita menjadi hitungan</td></tr><tr><td>3 HOTS</td><td>Soal bernalar, beberapa langkah</td><td>Berpikir kritis dan menyusun strategi</td></tr></tbody></table></div>
<h3 class="grp">Tips belajar matematika</h3>
<ul class="pts"><li>Belajar sedikit tetapi sering: 20 menit tiap hari lebih baik daripada 3 jam sekali.</li><li>Tulis langkah pengerjaan. Banyak kesalahan hilang karena langkahnya tertulis rapi.</li><li>Setelah dapat jawaban, tanya diri sendiri: masuk akal atau tidak?</li><li>Salah itu wajar. Soal yang salah adalah petunjuk bagian mana yang perlu diperkuat.</li></ul>
</div></section>
<article class="panel" id="bab-1" style="--c:var(--c1)"><header class="chead"><div class="wrap"><h2>Bab 1. Bilangan Bulat dan Pecahan</h2><div class="intro"><p>Bab ini memperluas kemampuan hitungmu ke bilangan negatif, lalu mengenalkan faktor, FPB, dan KPK. Tiga sub-bab: memahami bilangan bulat, operasi hitungnya, dan faktor.</p></div><p class="meta">3 sub-bab dan 14 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-1-1" href="#bab-1-1">1.1 Memahami Bilangan Bulat<span class="donemark">selesai</span></a><a class="stab stab-1-2" href="#bab-1-2">1.2 Operasi Hitung Bilangan Bulat<span class="donemark">selesai</span></a><a class="stab stab-1-3" href="#bab-1-3">1.3 Faktor Bilangan Bulat<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-1-1"><div class="wrap"><h3 class="st">1.1 Memahami Bilangan Bulat</h3><p class="idea"><strong>Ide pokok.</strong> Bilangan bulat adalah bilangan yang letaknya di garis bilangan: ..., −3, −2, −1, 0, 1, 2, 3, ... Makin ke kanan, makin besar.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Bilangan bulat terdiri dari bilangan negatif (−1, −2, ...), nol, dan bilangan positif (1, 2, ...).</li><li>Bilangan negatif sering muncul dalam hidup: suhu di bawah nol, kedalaman laut, utang, atau lantai basement.</li><li>Pada garis bilangan, bilangan di sebelah kanan selalu lebih besar. Jadi −3 lebih besar dari −9.</li><li><strong>Lawan</strong> bilangan a adalah −a. Lawan 5 adalah −5, dan lawan −8 adalah 8.</li><li><strong>Nilai mutlak</strong> |a| adalah jarak a ke 0. Jarak tidak pernah negatif, jadi |−6| = 6 dan |6| = 6.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-1-1-1"><div class="extext">Mana yang lebih besar, −3 atau −9? Letakkan di garis bilangan. −3 lebih dekat ke kanan, jadi −3 lebih besar.</div><label class="got" for="x-1-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-1-1-2"><div class="extext">Penyelam Dimas berada di kedalaman −12 m dan penyelam Rina di −20 m. Siapa yang posisinya lebih tinggi? Karena −12 lebih besar dari −20, Dimas lebih tinggi.</div><label class="got" for="x-1-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-1-1-3"><div class="extext">Berapa banyak bilangan bulat x yang memenuhi |x| &lt; 4? Jaraknya ke 0 harus kurang dari 4, jadi x = −3, −2, −1, 0, 1, 2, 3. Jawabannya 7 bilangan.</div><label class="got" for="x-1-1-3"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Jangan mengira −9 lebih besar dari −3 hanya karena 9 lebih besar dari 3. Untuk bilangan negatif, urutannya terbalik. Ingat juga bahwa hasil nilai mutlak tidak pernah negatif.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Kanan lebih besar. Lawan a adalah −a. |a| adalah jarak ke 0 dan tidak pernah negatif.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 3 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-1-2">Lanjut ke 1.2 Operasi Hitung Bilangan Bulat</a></div></div></section><section class="sec" id="bab-1-2"><div class="wrap"><h3 class="st">1.2 Operasi Hitung Bilangan Bulat</h3><p class="idea"><strong>Ide pokok.</strong> Menjumlah dan mengurang berarti bergeser di garis bilangan. Mengalikan dan membagi mengikuti aturan tanda.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Menambah bilangan positif: geser ke kanan. Menambah bilangan negatif: geser ke kiri.</li><li>Mengurang sama dengan menambah lawannya: a − b = a + (−b). Jadi mengurang bilangan negatif sama dengan menambah, yaitu a − (−b) = a + b.</li><li>Aturan tanda untuk kali dan bagi:</li></ul>
<div class="tw"><table><thead><tr><th>Tanda dua bilangan</th><th>Hasil</th></tr></thead><tbody><tr><td>sama (+ dan +, atau − dan −)</td><td>positif</td></tr><tr><td>berbeda (+ dan −, atau − dan +)</td><td>negatif</td></tr></tbody></table></div>
<ul class="pts"><li>Urutan mengerjakan: kurung dulu, lalu kali dan bagi (dari kiri), terakhir tambah dan kurang (dari kiri).</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-1-2-1"><div class="extext">7 + (−10): mulai di 7, geser 10 ke kiri. Hasilnya −3.</div><label class="got" for="x-1-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-1-2-2"><div class="extext">−4 − (−9) = −4 + 9 = 5.</div><label class="got" for="x-1-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-1-2-3"><div class="extext">(−6) × (−5): tanda sama, hasilnya positif, yaitu 30.</div><label class="got" for="x-1-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-1-2-4"><div class="extext">(−48) ÷ 6: tanda berbeda, hasilnya negatif, yaitu −8.</div><label class="got" for="x-1-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-1-2-5"><div class="extext">Suhu kulkas −5°C, lalu naik 12°C. Hitung −5 + 12 = 7. Suhu sekarang 7°C.</div><label class="got" for="x-1-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-1-2-6"><div class="extext">Penyelam turun 3 m tiap menit selama 4 menit, lalu naik 5 m. Hitung (−3) × 4 + 5 = −12 + 5 = −7. Posisi akhir −7 m.</div><label class="got" for="x-1-2-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-1-2-7"><div class="extext">Hitung 5 − 3 × (−2) + (−4). Kali dulu: 3 × (−2) = −6. Lalu 5 − (−6) + (−4) = 5 + 6 − 4 = 7.</div><label class="got" for="x-1-2-7"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Pada 5 − 3 × (−2), jangan mengurangi dulu. Perkalian harus lebih dulu. Dan jangan lupa: kurang dengan negatif menjadi tambah.</p></details>
<p class="sum"><strong>Ringkasan.</strong> a − (−b) = a + b. Tanda sama menghasilkan positif, tanda berbeda menghasilkan negatif. Kerjakan kali dan bagi sebelum tambah dan kurang.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 7 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-1-3">Lanjut ke 1.3 Faktor Bilangan Bulat</a></div></div></section><section class="sec" id="bab-1-3"><div class="wrap"><h3 class="st">1.3 Faktor Bilangan Bulat</h3><p class="idea"><strong>Ide pokok.</strong> Faktor adalah bilangan yang membagi habis suatu bilangan. Dari faktor, kita bisa mencari FPB dan KPK.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Faktor</strong> dari 12 adalah 1, 2, 3, 4, 6, dan 12, karena semuanya membagi 12 tanpa sisa.</li><li><strong>Bilangan prima</strong> punya tepat dua faktor, yaitu 1 dan dirinya sendiri. Contoh: 2, 3, 5, 7, 11, 13. Angka 1 bukan prima, dan 2 adalah satu-satunya prima yang genap.</li><li><strong>Faktorisasi prima</strong> adalah menulis bilangan sebagai perkalian bilangan prima. Gunakan pohon faktor: 60 = 2 × 30 = 2 × 2 × 15 = 2 × 2 × 3 × 5 = 2² × 3 × 5.</li><li><strong>FPB</strong> adalah faktor persekutuan terbesar. Ambil bilangan prima yang sama-sama ada, dengan pangkat terkecil.</li><li><strong>KPK</strong> adalah kelipatan persekutuan terkecil. Ambil semua bilangan prima yang ada, dengan pangkat terbesar.</li><li>Untuk dua bilangan a dan b berlaku a × b = FPB × KPK.</li><li>Banyak faktor dari n = p^a × q^b adalah (a + 1)(b + 1). Contoh: 12 = 2² × 3, jadi banyak faktornya 3 × 2 = 6.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<p>Cari FPB dan KPK dari 24 dan 36.</p>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-1-3-1"><div class="extext">Faktorisasi: 24 = 2³ × 3 dan 36 = 2² × 3².</div><label class="got" for="x-1-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-1-3-2"><div class="extext">FPB: bilangan prima yang sama adalah 2 dan 3, pangkat terkecil 2² dan 3. FPB = 4 × 3 = 12.</div><label class="got" for="x-1-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-1-3-3"><div class="extext">KPK: semua prima, pangkat terbesar 2³ dan 3². KPK = 8 × 9 = 72.</div><label class="got" for="x-1-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-1-3-4"><div class="extext">Periksa: 24 × 36 = 864 dan 12 × 72 = 864. Cocok.</div><label class="got" for="x-1-3-4"><span></span></label></li></ol>
<h4 class="lab">Kapan memakai FPB, kapan KPK?</h4>
<div class="tw"><table><thead><tr><th>Petunjuk dalam soal</th><th>Pakai</th><th>Contoh</th></tr></thead><tbody><tr><td>dibagi rata, dipotong sama panjang, banyak kelompok terbanyak</td><td>FPB</td><td>24 klepon dan 36 serabi dibagi ke piring dengan isi sama tanpa sisa: paling banyak 12 piring</td></tr><tr><td>terjadi bersamaan lagi, berulang, jadwal</td><td>KPK</td><td>ronda tiap 4 hari dan tiap 6 hari: bersama lagi 12 hari kemudian</td></tr></tbody></table></div>
<h4 class="lab">Contoh bernalar (HOTS)</h4>
<p>Bilangan terkecil yang jika dibagi 4 dan 6 selalu bersisa 1. KPK dari 4 dan 6 adalah 12, lalu tambah 1. Jawabannya 13. Periksa: 13 ÷ 4 bersisa 1 dan 13 ÷ 6 bersisa 1.</p>
<details class="awas"><summary>Awas keliru</summary><p>FPB tidak mungkin lebih besar dari bilangan yang terkecil, dan KPK tidak mungkin lebih kecil dari bilangan yang terbesar. Jika hasilmu melanggar ini, periksa lagi. Jangan menganggap 1 sebagai bilangan prima.</p></details>
<p class="sum"><strong>Ringkasan.</strong> FPB = pangkat terkecil dari prima yang sama. KPK = pangkat terbesar dari semua prima. a × b = FPB × KPK.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 4 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-2">Lanjut ke Bab 2</a></div></div></section></article><article class="panel" id="bab-2" style="--c:var(--c2)"><header class="chead"><div class="wrap"><h2>Bab 2. Bilangan Rasional</h2><div class="intro"><p>Bilangan rasional adalah bilangan yang bisa ditulis sebagai pecahan. Bab ini membahas bilangan di antara dua bilangan, cara membandingkan, dan operasi hitungnya.</p></div><p class="meta">3 sub-bab dan 23 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-2-1" href="#bab-2-1">2.1 Di Antara Dua Bilangan Bulat<span class="donemark">selesai</span></a><a class="stab stab-2-2" href="#bab-2-2">2.2 Membandingkan Bilangan Rasional<span class="donemark">selesai</span></a><a class="stab stab-2-3" href="#bab-2-3">2.3 Operasi Hitung Bilangan Rasional<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-2-1"><div class="wrap"><h3 class="st">2.1 Di Antara Dua Bilangan Bulat</h3><p class="idea"><strong>Ide pokok.</strong> Di antara dua bilangan bulat yang berurutan masih ada bilangan lain, dan jumlahnya tak terhingga.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Bilangan rasional</strong> adalah bilangan yang dapat ditulis a/b dengan a dan b bilangan bulat, serta b tidak sama dengan 0. Semua bilangan bulat juga rasional, misalnya 5 = 5/1.</li><li>Di antara 3 dan 4 ada 3,5; 3,25; 3,75; dan seterusnya tanpa habis.</li><li><strong>Titik tengah</strong> dua bilangan a dan b adalah (a + b) ÷ 2.</li><li>Pecahan dapat ditulis sebagai desimal dengan membagi pembilang dengan penyebut. Hasilnya berakhir (3/4 = 0,75) atau berulang (1/3 = 0,333...).</li><li>Pecahan paling sederhana berpenyebut yang hanya mengandung faktor 2 dan 5 selalu menjadi desimal berakhir.</li><li>Banyak bilangan berpenyebut d di antara dua bilangan bulat a dan b (keduanya tidak ikut dihitung) adalah (b − a) × d − 1.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-2-1-1"><div class="extext">Salah satu bilangan di antara 3 dan 4: titik tengahnya (3 + 4) ÷ 2 = 3,5.</div><label class="got" for="x-2-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-2-1-2"><div class="extext">Titik tengah 6 dan 14: (6 + 14) ÷ 2 = 10.</div><label class="got" for="x-2-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-2-1-3"><div class="extext">Ubah 5/8 menjadi desimal: 5 ÷ 8 = 0,625.</div><label class="got" for="x-2-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-2-1-4"><div class="extext">Berat bandeng tangkapan Pak Joko lebih dari 2 kg dan kurang dari 3 kg. Berat yang mungkin 2,5 kg.</div><label class="got" for="x-2-1-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-2-1-5"><div class="extext">Suhu tengah malam di dataran tinggi berada di antara −5°C dan −4°C. Suhu yang mungkin −4,5°C.</div><label class="got" for="x-2-1-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-2-1-6"><div class="extext">Ada berapa bilangan berpenyebut 4 di antara 1 dan 3? Bentuknya k/4 dengan 4 &lt; k &lt; 12, yaitu k = 5, 6, ..., 11. Ada 7 bilangan. Dengan rumus: (3 − 1) × 4 − 1 = 7.</div><label class="got" for="x-2-1-6"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Di antara −5 dan −4 bilangannya −4,5, bukan −5,5. Gambar garis bilangannya jika ragu. Dan titik tengah dua bilangan negatif tetap dihitung dengan menjumlahkan lalu membagi 2.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Titik tengah = (a + b) ÷ 2. Pecahan menjadi desimal dengan pembagian. Di antara dua bilangan selalu ada bilangan rasional lain.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 6 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-2-2">Lanjut ke 2.2 Membandingkan Bilangan Rasional</a></div></div></section><section class="sec" id="bab-2-2"><div class="wrap"><h3 class="st">2.2 Membandingkan Bilangan Rasional</h3><p class="idea"><strong>Ide pokok.</strong> Untuk membandingkan dua pecahan, buat keduanya "sama bentuk": sama penyebut, atau sama-sama desimal.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Cara 1, samakan penyebut. Pecahan dengan pembilang lebih besar (penyebut sama) lebih besar.</li><li>Cara 2, ubah ke desimal lalu bandingkan.</li><li>Cara 3, perkalian silang. Untuk b dan d positif: a/b &lt; c/d jika a × d &lt; b × c.</li><li>Pada bilangan negatif, makin besar nilai mutlaknya makin kecil nilainya. Jadi −3/4 lebih kecil dari −2/3.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-2-2-1"><div class="extext">Bandingkan 3/5 dan 4/7 dengan perkalian silang: 3 × 7 = 21 dan 4 × 5 = 20. Karena 21 &gt; 20, maka 3/5 lebih besar.</div><label class="got" for="x-2-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-2-2-2"><div class="extext">Urutkan dari terkecil: 1/2, 2/3, 3/5. Desimalnya 0,5; 0,667; 0,6. Urutannya 1/2 &lt; 3/5 &lt; 2/3.</div><label class="got" for="x-2-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-2-2-3"><div class="extext">Bandingkan −3/4 dan −2/3. Desimalnya −0,75 dan −0,667. Karena −0,75 berada lebih kiri, −3/4 lebih kecil.</div><label class="got" for="x-2-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-2-2-4"><div class="extext">Toko A memberi diskon 1/4 bagian dari harga, Toko B memberi diskon 20%. Ubah 1/4 menjadi 25%. Diskon Toko A lebih besar.</div><label class="got" for="x-2-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-2-2-5"><div class="extext">Mana yang lebih dekat ke 1, 7/8 atau 9/10? Selisihnya 1/8 dan 1/10. Karena 1/10 lebih kecil, 9/10 lebih dekat ke 1.</div><label class="got" for="x-2-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-2-2-6"><div class="extext">Ada berapa bilangan bulat di antara −5/2 dan 7/3? Desimalnya −2,5 dan 2,33. Bilangan bulatnya −2, −1, 0, 1, 2. Ada 5.</div><label class="got" for="x-2-2-6"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Jangan membandingkan pecahan hanya dari penyebutnya. Pecahan 1/8 lebih kecil dari 1/5, padahal 8 lebih besar dari 5. Makin besar penyebut (pembilang sama), makin kecil pecahannya.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Samakan penyebut, atau ubah ke desimal, atau kalikan silang. Pada bilangan negatif, urutannya terbalik.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 6 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-2-3">Lanjut ke 2.3 Operasi Hitung Bilangan Rasional</a></div></div></section><section class="sec" id="bab-2-3"><div class="wrap"><h3 class="st">2.3 Operasi Hitung Bilangan Rasional</h3><p class="idea"><strong>Ide pokok.</strong> Aturan operasi pecahan sama seperti saat kamu SD, hanya sekarang bilangannya bisa negatif.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Tambah dan kurang</strong>: samakan penyebut, lalu hitung pembilangnya. Penyebut tidak ikut dijumlahkan.</li><li><strong>Kali</strong>: pembilang kali pembilang, penyebut kali penyebut.</li><li><strong>Bagi</strong>: kalikan dengan kebalikan pecahan kedua. a/b ÷ c/d = a/b × d/c.</li><li><strong>Desimal</strong>: sejajarkan tanda koma, lalu hitung seperti bilangan bulat.</li><li>Urutan operasi sama seperti bilangan bulat. Selalu sederhanakan hasil akhir.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-2-3-1"><div class="extext">2/3 + 3/4 = 8/12 + 9/12 = 17/12 = 1 5/12.</div><label class="got" for="x-2-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-2-3-2"><div class="extext">5/6 − 1/4 = 10/12 − 3/12 = 7/12.</div><label class="got" for="x-2-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-2-3-3"><div class="extext">3/4 × 2/9 = 6/36 = 1/6.</div><label class="got" for="x-2-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-2-3-4"><div class="extext">2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6.</div><label class="got" for="x-2-3-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-2-3-5"><div class="extext">1/2 + 2/3 × 3/4: kali dulu, 2/3 × 3/4 = 1/2. Lalu 1/2 + 1/2 = 1.</div><label class="got" for="x-2-3-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-2-3-6"><div class="extext">5,6 − 2,75: tulis 5,60 − 2,75 = 2,85.</div><label class="got" for="x-2-3-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-2-3-7"><div class="extext">Ibu membeli 3/4 kg bandeng dan 1/2 kg udang. Beratnya 3/4 + 2/4 = 5/4 kg, atau 1 1/4 kg.</div><label class="got" for="x-2-3-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-2-3-8"><div class="extext">Tambak seluas 6 hektare, dan 2/3 bagian dipakai untuk udang. Luasnya 6 × 2/3 = 4 hektare.</div><label class="got" for="x-2-3-8"><span></span></label></li><li class="ex e9"><input class="exc" type="checkbox" id="x-2-3-9"><div class="extext">Pita sepanjang 3/4 m dipotong tiap 1/8 m. Banyak potongan 3/4 ÷ 1/8 = 3/4 × 8 = 6 potong.</div><label class="got" for="x-2-3-9"><span></span></label></li><li class="ex e10"><input class="exc" type="checkbox" id="x-2-3-10"><div class="extext">Tangki berisi 120 liter. Pagi terpakai 1/4 bagian, sisa 90 liter. Sore terpakai 1/3 dari sisa pagi, yaitu 30 liter. Air tersisa 90 − 30 = 60 liter.</div><label class="got" for="x-2-3-10"><span></span></label></li><li class="ex e11"><input class="exc" type="checkbox" id="x-2-3-11"><div class="extext">Rata-rata dari 1/4, 1/2, dan 3/4: jumlahnya 6/4 = 3/2, lalu dibagi 3 menjadi 1/2.</div><label class="got" for="x-2-3-11"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>1/2 + 1/3 bukan 2/5. Penyebut harus disamakan dulu (jawabannya 5/6). Pada pembagian, yang dibalik adalah pecahan kedua, bukan yang pertama.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Tambah dan kurang butuh penyebut sama. Kali langsung. Bagi berarti kali kebalikan. Sederhanakan hasil.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i><i class="seg e9"></i><i class="seg e10"></i><i class="seg e11"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 11 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-3">Lanjut ke Bab 3</a></div></div></section></article><article class="panel" id="bab-3" style="--c:var(--c3)"><header class="chead"><div class="wrap"><h2>Bab 3. Rasio dan Perbandingan</h2><div class="intro"><p>Bab ini mengajarkan cara membandingkan dua besaran, membaca peta dengan skala, dan menghitung laju seperti kecepatan dan debit air.</p></div><p class="meta">3 sub-bab dan 24 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-3-1" href="#bab-3-1">3.1 Konsep Rasio<span class="donemark">selesai</span></a><a class="stab stab-3-2" href="#bab-3-2">3.2 Skala<span class="donemark">selesai</span></a><a class="stab stab-3-3" href="#bab-3-3">3.3 Laju Perubahan Satuan<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-3-1"><div class="wrap"><h3 class="st">3.1 Konsep Rasio</h3><p class="idea"><strong>Ide pokok.</strong> Rasio a : b membandingkan dua besaran. Menyederhanakannya sama seperti menyederhanakan pecahan.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Sederhanakan rasio dengan membagi kedua bilangan dengan FPB-nya. Contoh: 18 : 24, FPB-nya 6, hasilnya 3 : 4.</li><li>Rasio senilai: kalikan atau bagi kedua suku dengan bilangan yang sama. 3 : 5 = 6 : 10 = 12 : 20.</li><li>Membagi total T dengan rasio a : b: jumlahkan bagian (a + b). Bagian pertama = a/(a + b) × T.</li><li><strong>Perbandingan senilai</strong>: yang satu naik, yang lain ikut naik (harga dan banyak barang).</li><li><strong>Perbandingan berbalik nilai</strong>: yang satu naik, yang lain turun, dan hasil kalinya tetap (banyak pekerja dan lama pekerjaan).</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-3-1-1"><div class="extext">Sederhanakan 18 : 24. FPB 6, jadi 3 : 4.</div><label class="got" for="x-3-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-3-1-2"><div class="extext">Uang Rp400 ribu dibagi dengan rasio 3 : 5. Jumlah bagian 3 + 5 = 8, sehingga satu bagian Rp50 ribu. Bagian pertama Rp150 ribu, bagian kedua Rp250 ribu.</div><label class="got" for="x-3-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-3-1-3"><div class="extext">Perbandingan bandeng dan udang di tambak 5 : 3. Jika bandeng 20 ekor, satu bagian 20 ÷ 5 = 4, jadi udang 3 × 4 = 12 ekor.</div><label class="got" for="x-3-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-3-1-4"><div class="extext">Senilai: 4 kg jeruk seharga Rp120 ribu. Harga per kg Rp30 ribu, maka 7 kg seharga Rp210 ribu.</div><label class="got" for="x-3-1-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-3-1-5"><div class="extext">Berbalik nilai: 6 pekerja menyelesaikan gazebo dalam 12 hari. Total kerja 6 × 12 = 72. Jika pekerja menjadi 9, waktunya 72 ÷ 9 = 8 hari.</div><label class="got" for="x-3-1-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-3-1-6"><div class="extext">Rasio bersambung: A : B = 2 : 3 dan B : C = 4 : 5. Samakan nilai B, yaitu 12. A : B = 8 : 12 dan B : C = 12 : 15. Jadi A : C = 8 : 15.</div><label class="got" for="x-3-1-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-3-1-7"><div class="extext">Umur ayah dan anak 5 : 3, selisihnya 16 tahun. Selisih 2 bagian = 16, jadi 1 bagian = 8. Umur anak 3 × 8 = 24 tahun.</div><label class="got" for="x-3-1-7"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Untuk membagi total, jangan membagi dengan salah satu angka rasio saja. Bagilah dengan jumlah semua bagian. Dan jangan memakai cara senilai pada soal berbalik nilai.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Rasio disederhanakan dengan FPB. Senilai: bagi lalu kali. Berbalik nilai: hasil kali tetap.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 7 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-3-2">Lanjut ke 3.2 Skala</a></div></div></section><section class="sec" id="bab-3-2"><div class="wrap"><h3 class="st">3.2 Skala</h3><p class="idea"><strong>Ide pokok.</strong> Skala adalah rasio antara jarak pada peta (atau denah) dengan jarak sebenarnya.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Skala 1 : 100.000 artinya 1 cm di peta mewakili 100.000 cm di kenyataan.</li><li>Jarak sebenarnya = jarak di peta × penyebut skala. Jarak di peta = jarak sebenarnya ÷ penyebut skala.</li><li>Satuan: 100 cm = 1 m dan 100.000 cm = 1 km.</li><li>Mencari skala: jarak peta : jarak sebenarnya (dengan satuan sama), lalu disederhanakan menjadi 1 : n.</li><li>Perbandingan luas = kuadrat dari perbandingan panjang.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-3-2-1"><div class="extext">Skala 1 : 200.000 dan jarak dua kota di peta 6 cm. Jarak sebenarnya 6 × 200.000 = 1.200.000 cm = 12 km.</div><label class="got" for="x-3-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-3-2-2"><div class="extext">Jarak sebenarnya 15 km pada skala 1 : 500.000. 15 km = 1.500.000 cm, dibagi 500.000 sama dengan 3 cm di peta.</div><label class="got" for="x-3-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-3-2-3"><div class="extext">Denah rumah berskala 1 : 200 dan panjang ruang di denah 4 cm. Panjang sebenarnya 4 × 200 = 800 cm = 8 m.</div><label class="got" for="x-3-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-3-2-4"><div class="extext">Jarak sebenarnya dua desa 12 km dan di peta 6 cm. 12 km = 1.200.000 cm, jadi skalanya 6 : 1.200.000 = 1 : 200.000.</div><label class="got" for="x-3-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-3-2-5"><div class="extext">Skala 1 : 100.000 dan jarak di peta 10 cm, jadi jarak sebenarnya 10 km. Naik motor 40 km/jam, waktunya 10 ÷ 40 jam = 1/4 jam = 15 menit.</div><label class="got" for="x-3-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-3-2-6"><div class="extext">Denah berskala 1 : 100. Ruang di denah 5 cm × 4 cm, jadi ukuran asli 5 m × 4 m dan luasnya 20 m².</div><label class="got" for="x-3-2-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-3-2-7"><div class="extext">Peta berskala 1 : 200.000 difotokopi dengan pembesaran 2 kali. Gambar jadi 2 kali lebih besar, sehingga skala baru 1 : 100.000.</div><label class="got" for="x-3-2-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-3-2-8"><div class="extext">Skala 1 : 1.000 dan luas di peta 4 cm². Luas sebenarnya 4 × 1.000² = 4.000.000 cm². Karena 1 m² = 10.000 cm², luasnya 400 m².</div><label class="got" for="x-3-2-8"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Pastikan satuan sudah sama sebelum menyusun skala. Pada pembesaran gambar, skala berubah: gambar lebih besar berarti penyebut lebih kecil. Pada luas, penyebut skala dikuadratkan.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Jarak asli = jarak peta × penyebut skala. 100.000 cm = 1 km. Luas memakai skala kuadrat.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 8 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-3-3">Lanjut ke 3.3 Laju Perubahan Satuan</a></div></div></section><section class="sec" id="bab-3-3"><div class="wrap"><h3 class="st">3.3 Laju Perubahan Satuan</h3><p class="idea"><strong>Ide pokok.</strong> Laju adalah seberapa banyak sesuatu berubah tiap satuan waktu: kecepatan untuk jarak, dan debit untuk volume air.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li>Kecepatan = jarak ÷ waktu. Jarak = kecepatan × waktu. Waktu = jarak ÷ kecepatan.</li><li>Debit = volume ÷ waktu.</li><li>Mengubah satuan: 1 km/jam = 5/18 m/s, atau 1 m/s = 3,6 km/jam.</li><li>1 jam = 60 menit = 3.600 detik. 1 liter = 1 dm³. 1 m³ = 1.000 liter.</li><li>Jika dua benda berjalan saling mendekat, kecepatan keduanya dijumlahkan.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-3-3-1"><div class="extext">72 km/jam = 72 × 5/18 = 20 m/s.</div><label class="got" for="x-3-3-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-3-3-2"><div class="extext">15 m/s = 15 × 3,6 = 54 km/jam.</div><label class="got" for="x-3-3-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-3-3-3"><div class="extext">Naik motor 60 km/jam selama 2,5 jam menempuh 150 km.</div><label class="got" for="x-3-3-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-3-3-4"><div class="extext">Menempuh 120 km dalam 2 jam 30 menit (2,5 jam), kecepatan rata-ratanya 120 ÷ 2,5 = 48 km/jam.</div><label class="got" for="x-3-3-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-3-3-5"><div class="extext">Air mengalir 600 liter dalam 5 menit. Debitnya 600 ÷ 5 = 120 liter/menit.</div><label class="got" for="x-3-3-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-3-3-6"><div class="extext">Kolam 4 m³ diisi dengan debit 20 liter/detik. 4 m³ = 4.000 liter, jadi waktunya 4.000 ÷ 20 = 200 detik.</div><label class="got" for="x-3-3-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-3-3-7"><div class="extext">Kran pertama memenuhi bak dalam 10 menit dan kran kedua 15 menit. Dibuka bersamaan, dalam 1 menit terisi 1/10 + 1/15 = 1/6 bak. Jadi penuh dalam 6 menit.</div><label class="got" for="x-3-3-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-3-3-8"><div class="extext">Dua motor berangkat bersamaan dari dua kota berjarak 90 km, saling berhadapan, dengan kecepatan 40 dan 50 km/jam. Kecepatan gabungan 90 km/jam, jadi bertemu setelah 1 jam = 60 menit.</div><label class="got" for="x-3-3-8"><span></span></label></li><li class="ex e9"><input class="exc" type="checkbox" id="x-3-3-9"><div class="extext">Pergi 40 km/jam dan pulang 60 km/jam lewat jalan yang sama. Kecepatan rata-ratanya bukan 50, tetapi jarak total dibagi waktu total. Untuk jarak 120 km: pergi 3 jam, pulang 2 jam, total 240 km dalam 5 jam, jadi 48 km/jam.</div><label class="got" for="x-3-3-9"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Kecepatan rata-rata pergi-pulang bukan rata-rata dua kecepatan. Samakan satuan sebelum menghitung, misalnya menit dengan menit atau jam dengan jam.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Kecepatan = jarak ÷ waktu. Debit = volume ÷ waktu. km/jam × 5/18 menjadi m/s. m/s × 3,6 menjadi km/jam.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i><i class="seg e9"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 9 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-4">Lanjut ke Bab 4</a></div></div></section></article><article class="panel" id="bab-4" style="--c:var(--c4)"><header class="chead"><div class="wrap"><h2>Bab 4. Himpunan</h2><div class="intro"><p>Bab ini membahas pengelompokan bilangan dan benda ke dalam himpunan, lalu menggambarkannya dengan diagram Venn. Sub-bab: mengklasifikasi himpunan bilangan real dengan diagram Venn.</p></div><p class="meta">1 sub-bab dan 9 contoh yang bisa kamu centang satu per satu.</p></div></header><section class="sec" id="bab-4-1"><div class="wrap"><h3 class="st">4.1 Himpunan Bilangan Real dan Diagram Venn</h3><p class="idea"><strong>Ide pokok.</strong> Himpunan adalah kumpulan benda atau bilangan yang jelas anggotanya. Diagram Venn membantu kita melihat bagian yang sama dan bagian yang berbeda antar himpunan.</p>
<h4 class="lab">Penjelasan: istilah dasar</h4>
<ul class="pts"><li><strong>Himpunan</strong> ditulis dengan kurung kurawal, misalnya A = {1, 2, 3}. Isinya disebut <strong>anggota</strong>.</li><li><strong>n(A)</strong> adalah banyak anggota himpunan A. Untuk A = {1, 2, 3}, n(A) = 3.</li><li><strong>Irisan</strong> A ∩ B: anggota yang ada di A dan juga di B.</li><li><strong>Gabungan</strong> A ∪ B: anggota yang ada di A atau B (anggota yang sama ditulis sekali).</li><li><strong>Himpunan bagian</strong>: B adalah himpunan bagian dari A jika semua anggota B ada di A. Himpunan dengan n anggota punya 2ⁿ himpunan bagian.</li><li>Rumus penting: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Dikurangi irisan karena bagian yang sama terhitung dua kali.</li></ul>
<h4 class="lab">Penjelasan: jenis bilangan</h4>
<div class="tw"><table><thead><tr><th>Himpunan</th><th>Isi</th><th>Contoh</th></tr></thead><tbody><tr><td>Bilangan asli</td><td>1, 2, 3, ...</td><td>7, 25</td></tr><tr><td>Bilangan cacah</td><td>0, 1, 2, ...</td><td>0, 12</td></tr><tr><td>Bilangan bulat</td><td>..., −2, −1, 0, 1, 2, ...</td><td>−9, 0, 4</td></tr><tr><td>Bilangan rasional</td><td>bisa ditulis a/b, b ≠ 0</td><td>3/4, −2/5, 0,75</td></tr><tr><td>Bilangan irasional</td><td>desimalnya tidak berakhir dan tidak berulang</td><td>√2, √3, π</td></tr></tbody></table></div>
<p>Urutan "kamar"-nya: asli ada di dalam cacah, cacah di dalam bulat, bulat di dalam rasional. Rasional dan irasional digabung menjadi bilangan real. Akar dari bilangan kuadrat sempurna (misalnya √9 = 3) adalah rasional, sedangkan akar bukan kuadrat sempurna (misalnya √2) adalah irasional.</p>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-4-1-1"><div class="extext">Tentukan himpunan terkecil yang memuat −7. Bukan asli, bukan cacah, tetapi bulat. Jawabannya bilangan bulat.</div><label class="got" for="x-4-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-4-1-2"><div class="extext">Himpunan terkecil yang memuat 3/4: bukan bulat, tetapi rasional. Jawabannya bilangan rasional.</div><label class="got" for="x-4-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-4-1-3"><div class="extext">Himpunan terkecil yang memuat √16: √16 = 4, jadi bilangan asli.</div><label class="got" for="x-4-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-4-1-4"><div class="extext">A = {1, 2, 3, 4, 5} dan B = {4, 5, 6, 7}. Irisan A ∩ B = {4, 5}. Gabungan A ∪ B = {1, 2, 3, 4, 5, 6, 7}. Cek rumus: 5 + 4 − 2 = 7.</div><label class="got" for="x-4-1-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-4-1-5"><div class="extext">Dari 40 siswa kelas VII, 22 suka matematika, 18 suka IPA, dan 10 suka keduanya. Yang suka salah satu atau keduanya: 22 + 18 − 10 = 30. Yang tidak suka keduanya: 40 − 30 = 10. Yang hanya suka matematika: 22 − 10 = 12.</div><label class="got" for="x-4-1-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-4-1-6"><div class="extext">Semua dari 35 siswa ikut paling sedikit satu lomba: 25 siswa lomba cerdas cermat dan 20 siswa lomba pidato. Yang ikut keduanya: 25 + 20 − 35 = 10 siswa.</div><label class="got" for="x-4-1-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-4-1-7"><div class="extext">Himpunan K punya 4 anggota. Banyak himpunan bagian 2⁴ = 16. Yang bukan himpunan K sendiri (himpunan bagian sejati) ada 15.</div><label class="got" for="x-4-1-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-4-1-8"><div class="extext">Dari bilangan √2, 5, −3, 1/2, π, √25, banyak bilangan irasional ada 2, yaitu √2 dan π. Sebab √25 = 5 itu rasional.</div><label class="got" for="x-4-1-8"><span></span></label></li><li class="ex e9"><input class="exc" type="checkbox" id="x-4-1-9"><div class="extext">Diagonal persegi bersisi 1 cm panjangnya √2 cm. Karena √2 tidak berakhir dan tidak berulang, ukuran ini bilangan irasional.</div><label class="got" for="x-4-1-9"><span></span></label></li></ol>
<h4 class="lab">Cara menggambar diagram Venn untuk soal cerita</h4>
<ol class="steps"><li>Gambar dua lingkaran yang saling beririsan di dalam persegi panjang (semesta).</li><li>Isi bagian irisan lebih dulu (yang suka keduanya).</li><li>Isi bagian yang hanya satu himpunan dengan cara total himpunan itu dikurangi irisan.</li><li>Isi bagian di luar lingkaran dengan total semesta dikurangi semua yang sudah terisi.</li><li>Jumlahkan semua bagian. Hasilnya harus sama dengan jumlah semesta.</li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Mengisi lingkaran dengan total satu himpunan tanpa mengurangi irisan membuat irisan terhitung dua kali. Dan jangan menganggap semua bentuk akar sebagai irasional: √25 dan √49 itu rasional.</p></details>
<p class="sum"><strong>Ringkasan.</strong> n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Himpunan dengan n anggota punya 2ⁿ himpunan bagian. Akar kuadrat sempurna rasional, akar lainnya irasional.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i><i class="seg e9"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 9 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-5">Lanjut ke Bab 5</a></div></div></section></article><article class="panel" id="bab-5" style="--c:var(--c5)"><header class="chead"><div class="wrap"><h2>Bab 5. Bentuk Aljabar</h2><div class="intro"><p>Aljabar memakai huruf untuk mewakili bilangan yang belum diketahui. Bab ini membahas unsur-unsurnya, cara menghitungnya, dan cara mengubah cerita menjadi persamaan.</p></div><p class="meta">3 sub-bab dan 24 contoh yang bisa kamu centang satu per satu.</p></div></header><nav class="subbar" aria-label="Sub-bab"><div class="wrap"><div class="subtabs"><a class="stab stab-5-1" href="#bab-5-1">5.1 Unsur-Unsur Bentuk Aljabar<span class="donemark">selesai</span></a><a class="stab stab-5-2" href="#bab-5-2">5.2 Sifat-Sifat dan Operasi Aljabar<span class="donemark">selesai</span></a><a class="stab stab-5-3" href="#bab-5-3">5.3 Pemodelan dengan Bentuk Aljabar<span class="donemark">selesai</span></a></div></div></nav><section class="sec" id="bab-5-1"><div class="wrap"><h3 class="st">5.1 Unsur-Unsur Bentuk Aljabar</h3><p class="idea"><strong>Ide pokok.</strong> Bentuk aljabar adalah gabungan bilangan dan huruf (variabel) dengan tanda operasi, misalnya 3x² − 5x + 7.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Variabel</strong>: huruf yang mewakili bilangan, misalnya x atau y.</li><li><strong>Koefisien</strong>: angka yang menempel di depan variabel, beserta tandanya. Pada 3x² − 5x + 7, koefisien x² adalah 3 dan koefisien x adalah −5.</li><li><strong>Konstanta</strong>: suku tanpa variabel. Pada contoh di atas, konstantanya 7.</li><li><strong>Suku</strong>: bagian yang dipisahkan tanda + atau −. Contoh tadi punya 3 suku.</li><li><strong>Suku sejenis</strong>: suku dengan variabel dan pangkat yang sama, misalnya 4x²y dan −2x²y. Suku 4x dan 4x² tidak sejenis.</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-5-1-1"><div class="extext">Pada 6x² − 2x + 9, koefisien x adalah −2 dan konstantanya 9.</div><label class="got" for="x-5-1-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-5-1-2"><div class="extext">Banyak suku pada 5x + 3y − 2xy + 8 adalah 4.</div><label class="got" for="x-5-1-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-5-1-3"><div class="extext">Suku yang sejenis dengan 3x²y adalah 7x²y, bukan 7xy² dan bukan 7x²: variabel dan pangkatnya harus sama persis.</div><label class="got" for="x-5-1-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-5-1-4"><div class="extext">Satu buku tulis harganya x rupiah dan satu pensil y rupiah. Rina membeli 2 buku tulis dan 3 pensil. Total harganya 2x + 3y.</div><label class="got" for="x-5-1-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-5-1-5"><div class="extext">Sewa motor di Kaliwungu: 15x + 10 (ribu rupiah), x = banyak jam. Tarif tiap jam 15 ribu (koefisien x), dan biaya tetap 10 ribu (konstanta).</div><label class="got" for="x-5-1-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-5-1-6"><div class="extext">Hitung nilai 3a² − 2ab + b jika a = 2 dan b = 3. Substitusi: 3(4) − 2(2)(3) + 3 = 12 − 12 + 3 = 3.</div><label class="got" for="x-5-1-6"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>Koefisien dari x adalah 1, dan koefisien dari −x adalah −1. Tanda minus ikut menjadi bagian koefisien. Saat substitusi bilangan negatif, beri tanda kurung.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Koefisien menempel pada variabel. Konstanta berdiri sendiri. Suku sejenis punya variabel dan pangkat yang sama persis.</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 6 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-5-2">Lanjut ke 5.2 Sifat-Sifat dan Operasi Aljabar</a></div></div></section><section class="sec" id="bab-5-2"><div class="wrap"><h3 class="st">5.2 Sifat-Sifat dan Operasi Aljabar</h3><p class="idea"><strong>Ide pokok.</strong> Hanya suku sejenis yang boleh dijumlahkan atau dikurangkan. Perkalian memakai sifat distributif.</p>
<h4 class="lab">Penjelasan</h4>
<ul class="pts"><li><strong>Tambah dan kurang</strong>: kumpulkan suku sejenis, lalu hitung koefisiennya.</li><li><strong>Sifat distributif</strong>: a(b + c) = ab + ac. Setiap suku dalam kurung dikali.</li><li><strong>Perkalian dua kurung</strong>: (a + b)(c + d) = ac + ad + bc + bd.</li><li><strong>Pangkat</strong>: xᵃ × xᵇ = xᵃ⁺ᵇ (pangkat dijumlahkan).</li><li><strong>Pembagian</strong>: bagi koefisiennya, lalu kurangi pangkatnya.</li><li><strong>Kuadrat jumlah</strong>: (m + n)² = m² + 2mn + n².</li></ul>
<h4 class="lab">Contoh bertahap</h4>
<ol class="exs"><li class="ex e1"><input class="exc" type="checkbox" id="x-5-2-1"><div class="extext">(3x + 5) + (2x − 8) = 5x − 3.</div><label class="got" for="x-5-2-1"><span></span></label></li><li class="ex e2"><input class="exc" type="checkbox" id="x-5-2-2"><div class="extext">(5x − 2) − (2x + 4) = 5x − 2 − 2x − 4 = 3x − 6. Tanda minus mengubah semua suku di dalam kurung kedua.</div><label class="got" for="x-5-2-2"><span></span></label></li><li class="ex e3"><input class="exc" type="checkbox" id="x-5-2-3"><div class="extext">3(x + 4) = 3x + 12.</div><label class="got" for="x-5-2-3"><span></span></label></li><li class="ex e4"><input class="exc" type="checkbox" id="x-5-2-4"><div class="extext">(x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15.</div><label class="got" for="x-5-2-4"><span></span></label></li><li class="ex e5"><input class="exc" type="checkbox" id="x-5-2-5"><div class="extext">x² × x³ = x⁵.</div><label class="got" for="x-5-2-5"><span></span></label></li><li class="ex e6"><input class="exc" type="checkbox" id="x-5-2-6"><div class="extext">12x² ÷ 3x = 4x.</div><label class="got" for="x-5-2-6"><span></span></label></li><li class="ex e7"><input class="exc" type="checkbox" id="x-5-2-7"><div class="extext">(x + 4)² = x² + 8x + 16.</div><label class="got" for="x-5-2-7"><span></span></label></li><li class="ex e8"><input class="exc" type="checkbox" id="x-5-2-8"><div class="extext">Kebun persegi panjang dengan panjang (x + 5) m dan lebar (x + 3) m. Kelilingnya 2 × (2x + 8) = 4x + 16 m. Luasnya x² + 8x + 15 m².</div><label class="got" for="x-5-2-8"><span></span></label></li><li class="ex e9"><input class="exc" type="checkbox" id="x-5-2-9"><div class="extext">Taman persegi bersisi (x + 4) m punya kolam persegi bersisi 2 m. Luas taman di luar kolam: (x + 4)² − 2² = x² + 8x + 16 − 4 = x² + 8x + 12 m².</div><label class="got" for="x-5-2-9"><span></span></label></li><li class="ex e10"><input class="exc" type="checkbox" id="x-5-2-10"><div class="extext">Pak Joko membeli 3 kg beras seharga (x + 2) ribu per kg dan 2 kg gula seharga x ribu per kg. Total belanja 3(x + 2) + 2x = 5x + 6 ribu rupiah.</div><label class="got" for="x-5-2-10"><span></span></label></li></ol>
<details class="awas"><summary>Awas keliru</summary><p>(x + 4)² bukan x² + 16. Suku tengah 8x tidak boleh hilang. Pada pengurangan, jangan lupa mengubah tanda semua suku dalam kurung. Dan x² × x³ bukan x⁶: pangkat dijumlahkan, bukan dikalikan.</p></details>
<p class="sum"><strong>Ringkasan.</strong> Jumlahkan hanya suku sejenis. Distributif: a(b + c) = ab + ac. xᵃ × xᵇ = xᵃ⁺ᵇ. (m + n)² = m² + 2mn + n².</p><div class="prog"><div class="segs"><i class="seg e1"></i><i class="seg e2"></i><i class="seg e3"></i><i class="seg e4"></i><i class="seg e5"></i><i class="seg e6"></i><i class="seg e7"></i><i class="seg e8"></i><i class="seg e9"></i><i class="seg e10"></i></div><p class="cnt">Sudah paham <b class="num"></b> dari 10 contoh.</p><p class="alldone">Semua contoh sudah kamu pahami. Waktunya latihan di MathLab 7.</p><a class="nextlnk" href="#bab-5-3">Lanjut ke 5.3 Pemodelan dengan Bentuk Aljabar</a></div></div></section><section class="sec" id="bab-5-3"><div class="wrap"><h3 class="st">5.3 Pemodelan dengan Bentuk Aljabar</h3><p class="idea"><strong>Ide pokok.</strong> Pemodelan berarti mengubah cerita menjadi persamaan, lalu menyelesaikannya.</p>
<h4 class="lab">Empat langkah</h4>
<ol class="steps"><li><strong>Misalkan</strong> bilangan yang dicari dengan huruf (misalnya x).</li><li><strong>Tulis</strong> persamaan dari informasi cerita.</li><li><strong>Selesaikan</strong>: pindahkan konstanta ke satu sisi, lalu bagi dengan koefisien. Untuk ax + b = c, hasilnya x = (c − b) ÷ a.</li><li><strong>Periksa</strong> jawaban dengan memasukkannya kembali ke cerita.</li></ol>
<h4 class="lab">Contoh bertahap</h4>
